<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Карточки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4255ff">
<title>Карточки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='44' height='34' rx='6' fill='%23aab4ff'/%3E%3Crect x='14' y='8' width='44' height='34' rx='6' fill='%234255ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --text:#1e2235; --muted:#6b7089; --line:#e3e6f0;
  --accent:#4255ff; --accent-soft:#eef0ff; --ok:#18a76a; --ok-soft:#e6f7ef; --bad:#e5484d; --bad-soft:#fdecec;
  --warn:#c98400; --warn-soft:#fff5e0;
  --t1:#e0332f; --t2:#1f9a4a; --t3:#2563eb; --t4:#8b3fc4;
  --radius:14px; --shadow:0 2px 10px rgba(30,34,53,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1220;--panel:#1a1e30;--text:#eceefa;--muted:#9aa0bd;--line:#2b3048;
  --accent:#7d8bff;--accent-soft:#232a52;--ok:#3ccf8e;--ok-soft:#173528;--bad:#ff6b6f;--bad-soft:#3a1d22;--warn:#f0b443;--warn-soft:#3a2f17;
  --t1:#ff6b66;--t2:#4fd17f;--t3:#6ea2ff;--t4:#c58af2;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:19px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:18px;border-radius:4px;background:var(--accent);box-shadow:-5px 4px 0 #aab4ff}
header .sp{flex:1}
header .who{color:var(--muted);font-size:14px;max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:26px;margin:4px 0 14px}
h2{font-size:19px;margin:26px 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.setcard{display:block;color:var(--text);position:relative;cursor:pointer}
.setcard:hover{border-color:var(--accent)}
.setcard b{display:block;font-size:17px;margin-bottom:4px;padding-right:22px;word-break:break-word}
.setcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.setcard .chk{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--panel)}
.setcard.sel .chk{background:var(--accent);border-color:var(--accent)}
.setcard.sel .chk::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.x{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=search],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:220px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}
.check input{width:20px;height:20px;margin-top:2px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:top;word-break:break-word}
td:first-child{font-weight:600;width:40%}
td.n{width:36px;color:var(--muted);font-weight:400}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0;display:flex}
.progress>i{display:block;height:100%;background:var(--ok)}
.progress>i.b{background:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode{text-align:left;padding:18px;cursor:pointer;font:inherit;color:var(--text);display:block}
.mode b{display:block;font-size:18px}
.mode:hover{border-color:var(--accent)}
.big{font-size:2.6em;line-height:1.15}
.pron{font-size:.62em;color:var(--muted);margin-top:8px;font-style:italic}
td .pron{font-size:13px;margin-top:2px}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t0{color:var(--muted)}
.pron .t1,.pron .t2,.pron .t3,.pron .t4{font-style:normal;font-weight:600}
/* flip card */
.study-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flip{perspective:1400px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.flip .inner{position:relative;height:min(52vh,380px);transition:transform .45s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip.noanim .inner{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
  font-size:clamp(20px,4.6vw,30px);overflow:auto;word-break:break-word}
.face.back{transform:rotateY(180deg)}
.face .hint{position:absolute;top:12px;left:16px;font-size:13px;color:var(--muted)}
.flip.swl .face{border-color:var(--bad)} .flip.swr .face{border-color:var(--ok)}
.spk{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.spk.inline{position:static;width:36px;height:36px;vertical-align:middle;margin-left:6px}
.study-btns{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;margin-top:14px}
.btn.know{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.dont{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.hard{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.easy{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades .btn{flex-direction:column;gap:0;padding:8px 4px;line-height:1.2}
.grades .btn small{font-weight:400;font-size:12px;opacity:.85}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:52px;word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;min-width:22px;color:var(--muted);font-weight:600}
.question{font-size:clamp(20px,4.2vw,26px);padding:26px 20px;text-align:center;word-break:break-word;position:relative}
.answer-in{font-size:20px;padding:14px 16px;margin-top:14px}
.answer-in.right{border-color:var(--ok);background:var(--ok-soft)}
.answer-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:16px}
.fb.right{background:var(--ok-soft);color:var(--ok)}
.fb.wrong{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--text);font-weight:600;font-size:20px}
.score{font-size:44px;font-weight:800;margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:nowrap}
.seg button{border:0;background:var(--panel);color:var(--text);font:inherit;padding:9px 14px;cursor:pointer;min-height:42px}
.seg button.on{background:var(--accent);color:#fff}
.opts-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;margin-top:18px}
.opts-row>span{display:inline-flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile b{display:block;font-size:28px;line-height:1.1}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.z{background:var(--line)}
.bars-l{display:flex;gap:4px;font-size:11px;color:var(--muted)}
.bars-l span{flex:1;text-align:center}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.folder-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sres{display:block;color:var(--text);padding:10px 12px;border-top:1px solid var(--line)}
.sres:first-child{border-top:0}
.sres:hover{background:var(--accent-soft)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1e2235;color:#fff;
  padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.spin{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  h1{font-size:22px}
  .modes{grid-template-columns:1fr 1fr}
  .mode{padding:14px}
  .mode b{font-size:16px}
  .study-btns{grid-template-columns:1fr 1fr}
  .study-btns .nav{display:none}
  .seg button{padding:8px 11px;font-size:14px}
  header .who{display:none}
}
</style>
</head>
<body>

  <a class="logo" href="#/"><i></i>Карточки</a>

  <span id="hdr" class="row"></span>
</header>
<main id="app"><div class="spin">Загрузка…</div></main>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   НАСТРОЙКА. Вставьте сюда данные своего проекта Firebase
   (Firebase Console → Project settings → Your apps → Web app → Config).
   Пока поля пустые, сайт работает в демо-режиме: данные хранятся
   только в текущем браузере.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "ВСТАВЬТЕ_СЮДА_API_KEY",
  authDomain: "kartochki-e43c9.firebaseapp.com",
  projectId: "kartochki-e43c9",
  storageBucket: "kartochki-e43c9.firebasestorage.app",
  messagingSenderId: "255291311438",
  appId: "1:255291311438:web:711dbbec8a482d652c8a1f"
};
/* ===================================================================== */

const FB_VERSION = "10.12.2";
const NEW_PER_SESSION = 10;          // новых карточек за одно повторение
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
let store, user = null, cleanup = null, afterLogin = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2600); }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(36); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function plural(n, one, few, many){ const m10=n%10, m100=n%100; return n+" "+(m10===1&&m100!==11?one:m10>=2&&m10<=4&&(m100<10||m100>=20)?few:many); }
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const LS = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const tzMs = () => new Date().getTimezoneOffset()*6e4;
const today = () => Math.floor((Date.now()-tzMs())/864e5);              // номер текущего дня (локально)
const dayStr = n => new Date(n*864e5).toISOString().slice(0,10);         // номер дня -> "2026-11-24"
const fmtDay = n => new Date(n*864e5).toLocaleDateString("ru-RU",{day:"numeric",month:"short",timeZone:"UTC"});

/* ---------- Настройки (в браузере) ---------- */
const settings = { tones:true, autoSpeak:false, front:"t", pron:"front", shuffle:false, onlyNew:false, ...LS.get("kartochki_settings",{}) };
const saveSettings = () => LS.set("kartochki_settings", settings);

/* ---------- Пиньинь: тоны, цвета, сравнение ---------- */
const TONE_MAP={};
"āáǎà a|ēéěè e|īíǐì i|ōóǒò o|ūúǔù u|ǖǘǚǜ ü".split("|").forEach(g=>{ const [m,b]=g.split(" "); [...m].forEach((ch,i)=>TONE_MAP[ch]=[b,i+1]); });
const VOW="aeiouüvāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ";
const SYL_RE=new RegExp(`(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?[${VOW}]+(?:ng(?![${VOW}])|n(?![${VOW}])|r(?![${VOW}]))?[1-5]?`,"gi");
const isPinyin = s => /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(s) || /[a-zü]+[1-5]\b/i.test(s);
function sylTone(syl){ const d=syl.match(/[1-5]$/); if(d) return +d[0]%5; for(const ch of syl) if(TONE_MAP[ch.toLowerCase()]) return TONE_MAP[ch.toLowerCase()][1]; return 0; }
function toneHtml(s){
  if(!settings.tones||!isPinyin(s)) return esc(s);
  let out="", last=0; s.replace(SYL_RE,(m,off)=>{ out+=esc(s.slice(last,off))+`<span class="t${sylTone(m)}">${esc(m)}</span>`; last=off+m.length; return m; });
  return out+esc(s.slice(last));
}
function pinyinKey(s, withTones){
  let out=""; for(const syl of (s.toLowerCase().replace(/u:/g,"ü").match(SYL_RE)||[])){
    let base="", tone=0; for(const ch of syl){ if(TONE_MAP[ch]){ base+=TONE_MAP[ch][0]; tone=TONE_MAP[ch][1]; } else if(/[1-5]/.test(ch)) tone=+ch%5; else base+=ch; }
    out+=base.replace(/ü/g,"v")+(withTones&&tone?tone:"")+"|";
  } return out;
}
const normAns = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/\([^)]*\)/g," ").replace(/[.,;:!?«»"'’…\-–—]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){ if(Math.abs(a.length-b.length)>1) return 2; const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
function answerMatches(given, correct){
  const g=normAns(given); if(!g) return false;
  const variants=[normAns(correct), ...String(correct).split(/[;,/]/).map(normAns)].filter(Boolean);
  if(variants.includes(g)) return true;
  return variants.some(v=>v.length>=5&&lev(g,v)<=1) ? "typo" : false;
}

/* ---------- Озвучка ---------- */
const canSpeak = "speechSynthesis" in window;
const LANGS=[["auto","Автоматически"],["zh-CN","Китайский"],["en-US","Английский"],["fr-FR","Французский"],["de-DE","Немецкий"],["es-ES","Испанский"],["it-IT","Итальянский"],["ja-JP","Японский"],["ko-KR","Корейский"],["ru-RU","Русский"],["off","Без озвучки"]];
function langFor(text, setLang){
  if(setLang&&setLang!=="auto") return setLang;
  if(/[\u3040-\u30ff]/.test(text)) return "ja-JP";
  if(/[\uac00-\ud7af]/.test(text)) return "ko-KR";
  if(/[\u3400-\u9fff]/.test(text)) return "zh-CN";
  if(/[а-яё]/i.test(text)) return "ru-RU";
  return "en-US";
}
function speak(text, lang){
  if(!canSpeak||!text||lang==="off") return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=lang.startsWith("zh")?0.8:0.95;
    const vs=speechSynthesis.getVoices(), L=lang.toLowerCase();
    const v=vs.find(v=>v.lang.replace("_","-").toLowerCase()===L)||vs.find(v=>v.lang.toLowerCase().startsWith(L.slice(0,2)));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch{}
}
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch{} }
const SPK_SVG=`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 010 7M18.5 6a8 8 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const spkBtn = (c, cls="") => canSpeak&&c.lang!=="off" ? `<button class="spk ${cls}" data-say="${esc(c.t)}" data-lang="${esc(langFor(c.t,c.lang))}" title="Озвучить" aria-label="Озвучить">${SPK_SVG}</button>` : "";
document.addEventListener("click",e=>{ const b=e.target.closest("[data-say]"); if(b){ e.preventDefault(); e.stopPropagation(); speak(b.dataset.say,b.dataset.lang); } },true);
const autoSay = c => { if(settings.autoSpeak&&c&&c.lang!=="off") speak(c.t, langFor(c.t,c.lang)); };

/* ---------- Отображение карточек ---------- */
const termCls = t => [...t].length<=3 ? ' class="big"' : "";
const pronHtml = c => c.p ? `<div class="pron">${toneHtml(c.p)}</div>` : "";
const hasPron = cards => cards.some(c=>c.p);

/* ---------- Хранилища ---------- */
const localProg = {
  K: "kartochki_progress_v1",
  all(){ return LS.get(this.K, {}); },
  get(id){ return this.all()[id] || { known: [] }; },
  set(id, p){ const a=this.all(); a[id]={...(a[id]||{}),...p}; LS.set(this.K,a); },
  reset(id, p){ const a=this.all(); a[id]=p; LS.set(this.K,a); },
  list(){ return Object.entries(this.all()).map(([id,v])=>({id,...v})); },
  remove(id){ const a=this.all(); delete a[id]; LS.set(this.K,a); }

async function firebaseStore(cfg){

  const [A0,A,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
  const fapp=A0.initializeApp(cfg), auth=A.getAuth(fapp);
  let db;
  // локальный кэш базы: наборы и прогресс доступны без интернета, изменения уходят на сервер при появлении связи
  try{ db=F.initializeFirestore(fapp,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
  catch{ db=F.getFirestore(fapp); }
  let me=null;
  const progDoc=id=>F.doc(db,"users",me.uid,"progress",id);
  const bg=p=>{ p.catch(e=>{ console.error(e); if(e.code==="permission-denied") toast("Нет прав на сохранение"); }); };
  const get=async ref=>{ try{ return await F.getDoc(ref); }catch(e){ if(e.code==="permission-denied") throw e; return await F.getDocFromCache(ref); } };
  return {
    demo:false,
    onAuth(cb){ A.onAuthStateChanged(auth,u=>{ me=u; cb(u); }); },
    signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
    signUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),

    async mySets(){
      const snap=await F.getDocs(F.query(F.collection(db,"sets"),F.where("ownerId","==",me.uid)));
      return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.updatedAt-a.updatedAt);
    },
    async getSet(id){
      try{ const s=await get(F.doc(db,"sets",id)); return s.exists()?{id:s.id,...s.data()}:null; }
      catch(e){ return null; }
    },
    async saveSet(s){
      const data={title:s.title,description:s.description||"",folder:s.folder||"",lang:s.lang||"auto",cards:s.cards,public:!!s.public,
        ownerId:me.uid,createdAt:s.createdAt||Date.now(),updatedAt:Date.now()};
      const ref=s.id?F.doc(db,"sets",s.id):F.doc(F.collection(db,"sets"));
      const p=F.setDoc(ref,data); bg(p);
      if(navigator.onLine) await Promise.race([p,sleep(5000)]);   // без интернета не ждём - сохранится позже
      return ref.id;
    },
    async deleteSet(id){ bg(F.deleteDoc(F.doc(db,"sets",id))); bg(F.deleteDoc(progDoc(id))); },
    async getProgress(id){
      if(!me) return localProg.get(id);
      try{ const s=await get(progDoc(id)); return s.exists()?{known:[],...s.data()}:{known:[]}; }catch{ return {known:[]}; }
    },
    saveProgress(id,p){ if(!me) return localProg.set(id,p); bg(F.setDoc(progDoc(id),p,{merge:true})); },
    async resetProgress(id,p){ if(!me) return localProg.reset(id,p); bg(F.setDoc(progDoc(id),p)); },
    async studying(){
      if(!me) return localProg.list();

      return snap.docs.map(d=>({id:d.id,...d.data()}));

function nextSrs(st, grade){                   // grade: 0 не помню, 1 трудно, 2 помню, 3 легко
  st={reps:0,int:0,ease:2.5,lapses:0,...(st||{})};
  if(grade===0) return {reps:0,int:0,ease:Math.max(1.3,st.ease-0.2),lapses:st.lapses+1,due:today()};
  let int;
  if(st.reps===0) int=[0,1,1,3][grade];
  else if(st.reps===1) int=[0,2,3,5][grade];
  else int=Math.round(st.int*[0,1.2,st.ease,st.ease*1.3][grade]);
  int=Math.max(1,Math.min(int,3650));
  if(st.reps>=1&&int<=st.int&&grade>=2) int=st.int+1;
  return {reps:st.reps+1,int,ease:Math.max(1.3,st.ease+[0,-0.15,0,0.15][grade]),lapses:st.lapses,due:today()+int};
}

/* ---------- Разбор вставленного списка ---------- */
const SEP_RE={tab:/\t+/, eq:/\s*=\s*/, dash:/\s+[-–—]\s+|[–—]/, semicolon:/\s*;\s*/, colon:/\s*:\s*/, comma:/\s*,\s*/};
function splitN(line, re, n){
  const parts=[]; let rest=line;
  while(parts.length<n-1){ const m=rest.match(re); if(!m) break; parts.push(rest.slice(0,m.index)); rest=rest.slice(m.index+m[0].length); }
  parts.push(rest); return parts;
}
function splitLine(line, sep, n){
  if(sep!=="auto") return SEP_RE[sep].test(line)?splitN(line,SEP_RE[sep],n):null;
  // авто: на каждом шаге берём самый ранний из основных разделителей (табуляция, =, тире),
  // поэтому подходят и смешанные строки вида «丁=dīng — гвоздь»; ; и : - только если основных нет
  const parts=[]; let rest=line;
  while(parts.length<n-1){
    let best=null;
    for(const re of [SEP_RE.tab,SEP_RE.eq,SEP_RE.dash]){ const m=rest.match(re); if(m&&(!best||m.index<best.index)) best=m; }
    if(!best&&!parts.length) for(const re of [SEP_RE.semicolon,SEP_RE.colon]){ const m=rest.match(re); if(m){ best=m; break; } }
    if(!best) break;
    parts.push(rest.slice(0,best.index)); rest=rest.slice(best.index+best[0].length);
  }
  parts.push(rest);
  return parts.length>1?parts:null;
}
/* cols=2: термин | определение; cols=3: термин | произношение | определение
   (строка только из двух частей в режиме 3 тоже принимается - без произношения) */
function parseCards(text, sep, cols){
  const cards=[], bad=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    if(!raw.trim()) return;
    const parts=splitLine(raw.replace(/^\s+|\s+$/g,m=>m.replace(/[^\t]/g,"")), sep, cols);
    if(!parts||parts.length<2) return bad.push(i+1);
    const f=parts.map(x=>x.trim()), t=f[0], d=f[f.length-1], pr=f.length===3?f[1]:"";
    if(t&&d){ const c={id:hash(t+"\u0001"+d),t,d}; if(pr) c.p=pr; cards.push(c); } else bad.push(i+1);
  });
  return {cards,bad};
}

async function search(qs, mine, other){
  const box=$("#sr"), sets=$("#sets"); if(!box) return;
  const q=qs.trim().toLowerCase();
  if(!q){ box.innerHTML=""; sets.style.display=""; return; }
  sets.style.display="none";
  const all=[...mine, ...(await Promise.all(other.map(s=>getSetC(s.id)))).filter(Boolean)];
  const qp=pinyinKey(q,false).replace(/\|/g,""), res=[];
  for(const s of all) for(const c of s.cards){
    const hit=c.t.toLowerCase().includes(q)||c.d.toLowerCase().includes(q)||(c.p&&(c.p.toLowerCase().includes(q)||(qp.length>=2&&pinyinKey(c.p,false).replace(/\|/g,"").includes(qp))));
    if(hit){ res.push({s,c}); if(res.length>=60) break; }
  }
  if($("#q")?.value.trim().toLowerCase()!==q) return;
  box.innerHTML=res.length?`<div class="panel" style="padding:4px">${res.map(({s,c})=>`<a class="sres" href="#/set/${s.id}"><b>${esc(c.t)}</b>${c.p?` <span class="pron" style="font-size:14px">${toneHtml(c.p)}</span>`:""} - ${esc(c.d)}<br><span class="muted small">${esc(s.title)}</span></a>`).join("")}</div>`
    :`<div class="panel muted">Ничего не найдено</div>`;
}

/* ---------- Режим «Карточки» ---------- */
function viewCards(deck){
  const opt=settings, withPron=hasPron(deck.cards);
  let order=[], i=0, flipped=false, round={k:0,u:0}, unknown=[];
  const start=(list)=>{
    let cards=list||deck.cards;
    if(!list&&opt.onlyNew){ const f=cards.filter(c=>!deck.isKnown(c)); if(f.length) cards=f; else toast("Все карточки уже выучены - показываю все"); }
    order=opt.shuffle?shuffle(cards):cards.slice(); i=0; flipped=false; round={k:0,u:0}; unknown=[]; render(true);
  };
  function render(say){
    if(i>=order.length) return renderEnd();
    const c=order[i], term=`<div><div${termCls(c.t)}>${esc(c.t)}</div>`, def=`<div>${esc(c.d)}</div>`;
    const F=opt.front==="t"
      ? [term+(opt.pron==="front"?pronHtml(c):"")+`</div>`, (opt.pron==="back"&&c.p?`<div class="pron" style="margin:0 0 12px">${toneHtml(c.p)}</div>`:"")+def, "Термин", c.p&&opt.pron==="back"?"Произношение и определение":"Определение", spkBtn(c), ""]
      : [def, term+pronHtml(c)+`</div>`, "Определение", "Термин", "", spkBtn(c)];
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="muted small">${i+1} / ${order.length}</span></div>
      <div class="flip noanim ${flipped?"flipped":""}" id="card"><div class="inner">
        <div class="face front"><span class="hint">${F[2]}${deck.isKnown(c)?" · знаю":""}</span>${F[4]}<div>${F[0]}</div></div>
        <div class="face back"><span class="hint">${F[3]}</span>${F[5]}<div>${F[1]}</div></div></div></div>
      <p class="center muted small" style="margin:8px 0 0">Нажмите на карточку, чтобы перевернуть${matchMedia("(hover:none)").matches?" · смахните вправо - знаю, влево - не знаю":" · пробел, ← →, 1 - не знаю, 2 - знаю, S - озвучить"}</p>
      <div class="study-btns"><button class="btn nav" id="pv" ${i?"":"disabled"}>←</button><button class="btn dont" id="no">Не знаю</button><button class="btn know" id="yes">Знаю</button><button class="btn nav" id="nx">→</button></div>
      <div class="opts-row"><span><span class="small muted">Сначала:</span>${seg(opt,"front",[["t","Термин"],["d","Определение"]])}</span>
      ${withPron&&opt.front==="t"?`<span><span class="small muted">Произношение:</span>${seg(opt,"pron",[["front","Сразу"],["back","После переворота"]])}</span>`:""}
      ${seg(opt,"shuffle",[[false,"По порядку"],[true,"Перемешать"]])}${seg(opt,"onlyNew",[[false,"Все"],[true,"Только невыученные"]])}
      ${canSpeak?`<span><span class="small muted">Озвучка:</span>${seg(opt,"autoSpeak",[[false,"По кнопке"],[true,"Сама"]])}</span>`:""}
      ${withPron?`<span><span class="small muted">Тоны:</span>${seg(opt,"tones",[[true,"Цветом"],[false,"Без цвета"]])}</span>`:""}</div>`;
    requestAnimationFrame(()=>$("#card")?.classList.remove("noanim"));
    if(say&&opt.front==="t") autoSay(c);
    const card=$("#card");
    let sx=null, sy=null, swiped=false;
    card.onclick=()=>{ if(swiped){ swiped=false; return; } flip(); };
    card.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    card.addEventListener("touchmove",e=>{ if(sx===null) return; const dx=e.touches[0].clientX-sx;
      card.classList.toggle("swr",dx>50); card.classList.toggle("swl",dx<-50); },{passive:true});
    card.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
      card.classList.remove("swr","swl"); if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){ swiped=true; mark(dx>0); } });
    $("#no").onclick=()=>mark(false); $("#yes").onclick=()=>mark(true);
    $("#pv").onclick=()=>{ if(i>0){ i--; flipped=false; render(true); } };
    $("#nx").onclick=()=>{ i++; flipped=false; render(true); };
    bindSeg(opt,k=>{ saveSettings(); if(["front","pron","autoSpeak","tones"].includes(k)) render(); else start(); });
  }
  function flip(){ flipped=!flipped; $("#card")?.classList.toggle("flipped",flipped); if(flipped&&opt.front==="d") autoSay(order[i]); }
  function mark(k){
    const c=order[i]; if(!c) return;
    deck.setKnown(c,k); recordAnswer(k);
    if(k) round.k++; else { round.u++; unknown.push(c); deck.miss(c); }
    i++; flipped=false; render(true);
  }
  function renderEnd(){
    const total=deck.cards.length, kn=deck.cards.filter(deck.isKnown).length;
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a></div>
      <div class="panel center" style="padding:30px 20px"><h1>Круг пройден</h1>
      <p>Знаю: <b style="color:var(--ok)">${round.k}</b> · Ещё учить: <b style="color:var(--bad)">${round.u}</b></p>
      <div class="progress" style="max-width:360px;margin:12px auto"><i style="width:${Math.round(kn/total*100)}%"></i></div>
      <p class="muted small">Всего знаю ${kn} из ${total}</p>
      <div class="row" style="justify-content:center;margin-top:16px">
        ${unknown.length?`<button class="btn primary" id="ag">Повторить невыученные (${unknown.length})</button>`:""}
        <button class="btn" id="re">Начать сначала</button><a class="btn" href="#/study/${deck.idsStr}/test">Пройти тест</a></div></div>`;
    const ag=$("#ag"); if(ag) ag.onclick=()=>start(opt.shuffle?shuffle(unknown):unknown.slice());
    $("#re").onclick=()=>start();
  }
  const key=e=>{
    if(e.target.matches("input,textarea,select")||i>=order.length) return;
    if(e.code==="Space"||e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); flip(); }
    else if(e.key==="ArrowRight"){ i++; flipped=false; render(true); }
    else if(e.key==="ArrowLeft"&&i>0){ i--; flipped=false; render(true); }
    else if(e.key==="1") mark(false); else if(e.key==="2") mark(true);
    else if(e.key==="s"||e.key==="ы"){ const c=order[i]; speak(c.t,langFor(c.t,c.lang)); }
  };
  document.addEventListener("keydown",key); cleanup=()=>{ document.removeEventListener("keydown",key); };
  start();
}

/* ---------- Режим «Тест» ---------- */
function viewTest(deck){
  if(deck.cards.length<2){ app.innerHTML=`<p class="small"><a href="${deck.back}">← Назад</a></p><div class="panel">Для теста нужно хотя бы 2 карточки.</div>`; return; }
  const opt=LS.get("kartochki_test_opts",{n:"10",dir:"td"});
  const pronCards=deck.cards.filter(c=>c.p), withPron=new Set(pronCards.map(c=>c.p)).size>=2;
  if(opt.dir==="tp"&&!withPron) opt.dir="td";
  let qs=[], qi=0, answered=false, wrong=[], right=0;
  function setup(){
    const N=deck.cards.length;
    app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p><h1>Тест</h1>
      <div class="panel"><label>Количество вопросов</label>${seg(opt,"n",[...["10","20"].filter(v=>+v<N).map(v=>[v,v]),["all","Все ("+N+")"]])}
      <label>Что спрашивать</label>${seg(opt,"dir",[["td","Термин → определение"],["dt","Определение → термин"],...(withPron?[["tp","Термин → произношение"]]:[]),["mix","Вперемешку"]])}
      <div style="margin-top:20px"><button class="btn primary" id="go">Начать</button></div></div>`;
    if(opt.n!=="all"&&+opt.n>=N) opt.n="all";
    bindSeg(opt,()=>{ LS.set("kartochki_test_opts",opt); setup(); });
    $("#go").onclick=()=>{ const src=opt.dir==="tp"?pronCards:deck.cards; begin(shuffle(src).slice(0,opt.n==="all"?src.length:+opt.n)); };
  }
  function begin(cards){
    qs=cards.map(c=>{
      const dir=opt.dir==="mix"?(Math.random()<.5?"td":"dt"):opt.dir;
      const field=dir==="td"?"d":dir==="dt"?"t":"p", ask=dir==="dt"?c.d:c.t, ans=c[field];
      const pool=[...new Set(deck.cards.map(x=>x[field]).filter(Boolean))].filter(x=>x!==ans);
      // термин в вопросе показываем с произношением (кроме вопроса о самом произношении)
      const askHtml=(dir==="dt"?esc(ask):`<div${termCls(ask)}>${esc(ask)}</div>`)+(dir==="td"?pronHtml(c):"");
      // варианты-термины показываем с произношением, варианты-произношения - с цветом тонов
      const optHtml=o=>{ if(dir==="tp") return toneHtml(o); if(dir!=="dt") return esc(o); const pc=deck.cards.find(x=>x.t===o&&x.p); return esc(o)+(pc?` <span class="muted small">${toneHtml(pc.p)}</span>`:""); };
      return {card:c,dir,ask,askHtml,ans,optHtml,options:shuffle([ans,...shuffle(pool).slice(0,3)])};
    });
    qi=0; wrong=[]; right=0; renderQ();
  }
  function renderQ(){
    if(qi>=qs.length) return renderEnd();
    answered=false; const q=qs[qi];
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="muted small">${qi+1} / ${qs.length}</span></div>
      <div class="progress"><i class="b" style="width:${qi/qs.length*100}%"></i></div>
      <div class="panel question">${q.dir!=="dt"?spkBtn(q.card):""}<div class="muted small" style="margin-bottom:8px">${q.dir==="dt"?"Определение":"Термин"}</div>${q.askHtml}</div>
      <p class="muted small" style="margin:14px 0 0">Выберите ${{td:"определение",dt:"термин",tp:"произношение"}[q.dir]}:</p>
      <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span> ${q.optHtml(o)}</button>`).join("")}</div>
      <div id="nxw" style="margin-top:14px"></div>`;
    $$(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    if(q.dir!=="dt") autoSay(q.card);
  }
  function pick(k){
    if(answered) return; answered=true;
    const q=qs[qi], ok=q.options[k]===q.ans;
    recordAnswer(ok);
    $$(".opt").forEach((b,j)=>{ b.disabled=true; if(q.options[j]===q.ans) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
    if(q.dir==="dt") autoSay(q.card);
    if(ok){ right++; setTimeout(()=>{ if(qs[qi]===q){ qi++; renderQ(); } },700); }
    else { wrong.push({...q,given:q.options[k]}); deck.miss(q.card);
      $("#nxw").innerHTML=`<button class="btn primary" id="nx">Далее</button>`; $("#nx").onclick=()=>{ qi++; renderQ(); }; $("#nx").focus(); }
  }
  function renderEnd(){ renderResult(deck,right,qs.length,wrong.map(w=>({ask:w.askHtml,ans:w.dir==="tp"?toneHtml(w.ans):esc(w.ans),given:w.dir==="tp"?toneHtml(w.given):esc(w.given)})),
    ()=>begin(shuffle(wrong.map(w=>w.card))), setup); }
  const key=e=>{
    if(!qs.length||qi>=qs.length) return;
    if(!answered&&/^[1-4]$/.test(e.key)&&+e.key<=qs[qi].options.length) pick(+e.key-1);
    else if(answered&&e.key==="Enter"&&$("#nx")){ e.preventDefault(); $("#nx").click(); }
  };
  document.addEventListener("keydown",key); cleanup=()=>document.removeEventListener("keydown",key);
  setup();
}
function renderResult(deck, right, total, wrong, redo, again){
  const pct=Math.round(right/total*100);
  app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p>
    <div class="panel center" style="padding:26px 20px"><div class="muted">Результат</div>
    <div class="score" style="color:${pct>=80?"var(--ok)":pct>=50?"var(--accent)":"var(--bad)"}">${pct}%</div>
    <p>Правильно ${right} из ${total}</p>
    <div class="row" style="justify-content:center;margin-top:12px">${wrong.length?`<button class="btn primary" id="rw">Повторить ошибки (${wrong.length})</button>`:""}
    <button class="btn" id="ag">Ещё раз</button><a class="btn" href="#/study/${deck.idsStr}/review">Повторение</a></div></div>
    ${wrong.length?`<h2>Ошибки</h2><div class="panel" style="padding:4px 8px"><table>${wrong.map(w=>`<tr><td>${w.ask}</td><td><span style="color:var(--ok)">${w.ans}</span><br><span class="muted small">ваш ответ: ${w.given}</span></td></tr>`).join("")}</table></div>`:""}`;
  const rw=$("#rw"); if(rw) rw.onclick=redo;
  $("#ag").onclick=again;
}

/* ---------- Режим «Ввод ответа» ---------- */
function viewWrite(deck){
  const pronCards=deck.cards.filter(c=>c.p);
  const dirs=[...(pronCards.length?[["tp","Термин → произношение"]]:[]),["dt","Определение → термин"],["td","Термин → определение"]];
  const opt={n:"10",dir:dirs[0][0],tonesReq:true,...LS.get("kartochki_write_opts",{})};
  if(!dirs.some(d=>d[0]===opt.dir)) opt.dir=dirs[0][0];
  let qs=[], qi=0, done=false, wrong=[], right=0;
  function setup(){
    const src=opt.dir==="tp"?pronCards:deck.cards, N=src.length;
    if(opt.n!=="all"&&+opt.n>=N) opt.n="all";
    app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p><h1>Ввод ответа</h1>
      <div class="panel"><label>Что спрашивать</label>${seg(opt,"dir",dirs)}
      <label>Количество вопросов</label>${seg(opt,"n",[...["10","20"].filter(v=>+v<N).map(v=>[v,v]),["all","Все ("+N+")"]])}
      ${opt.dir==="tp"?`<label>Тоны</label>${seg(opt,"tonesReq",[[true,"Проверять"],[false,"Не проверять"]])}
      <p class="muted small" style="margin:8px 0 0">Пиньинь можно вводить с цифрами тонов: <code>ding1</code>, <code>zhong1guo2</code>, <code>lv4</code> - это то же, что <code>dīng</code>, <code>zhōngguó</code>, <code>lǜ</code>. Пробелы не важны.</p>`:""}
      <div style="margin-top:20px"><button class="btn primary" id="go">Начать</button></div></div>`;
    bindSeg(opt,()=>{ LS.set("kartochki_write_opts",opt); setup(); });
    $("#go").onclick=()=>begin(shuffle(src).slice(0,opt.n==="all"?N:+opt.n));
  }
  function begin(cards){
    qs=cards.map(c=>({card:c,dir:opt.dir,ans:opt.dir==="tp"?c.p:opt.dir==="dt"?c.t:c.d}));
    qi=0; wrong=[]; right=0; renderQ();
  }
  const askHtml=q=>q.dir==="dt"?esc(q.card.d):`<div${termCls(q.card.t)}>${esc(q.card.t)}</div>`+(q.dir==="td"?pronHtml(q.card):"");
  const ansHtml=(q,s)=>q.dir==="tp"?toneHtml(s):esc(s);
  function renderQ(){
    if(qi>=qs.length) return renderResult(deck,right,qs.length,wrong,()=>begin(shuffle(wrong.map(w=>w.card))),setup);
    done=false; const q=qs[qi];
    const ph={tp:"пиньинь, например ding1 или dīng",dt:"термин",td:"перевод"}[q.dir];
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="muted small">${qi+1} / ${qs.length}</span></div>
      <div class="progress"><i class="b" style="width:${qi/qs.length*100}%"></i></div>
      <div class="panel question">${q.dir!=="dt"?spkBtn(q.card):""}<div class="muted small" style="margin-bottom:8px">${q.dir==="dt"?"Определение":"Термин"}</div>${askHtml(q)}</div>
      <form id="af"><input type="text" class="answer-in" id="ans" placeholder="${ph}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <div class="row" style="margin-top:12px"><button class="btn primary" type="submit" id="chk">Проверить</button><button class="btn ghost" type="button" id="idk">Не знаю</button></div></form>
      <div id="fbw"></div>`;
    const inp=$("#ans"); setTimeout(()=>inp.focus(),50);
    $("#af").onsubmit=e=>{ e.preventDefault(); if(done){ next(); return; } if(inp.value.trim()) check(inp.value); };
    $("#idk").onclick=()=>{ if(!done) check(""); };
    if(q.dir!=="dt") autoSay(q.card);
  }
  function check(given){
    done=true; const q=qs[qi]; let ok=false, note="";
    if(!given){ ok=false; }
    else if(q.dir==="tp"){
      const a=pinyinKey(given,true), b=pinyinKey(q.ans,true), a0=pinyinKey(given,false), b0=pinyinKey(q.ans,false);
      ok=opt.tonesReq?a===b:a0===b0;
      if(!ok&&a0===b0&&a0) note="Слоги верные, но тоны другие.";
    } else { const m=answerMatches(given,q.ans); ok=!!m; if(m==="typo") note="Засчитано с опечаткой."; }
    recordAnswer(ok);
    const inp=$("#ans"); inp.readOnly=true; inp.classList.add(ok?"right":"wrong");
    $("#chk").textContent="Далее"; $("#idk").style.display="none";
    if(ok){ right++; $("#fbw").innerHTML=`<div class="fb right">Верно! <span class="ans">${ansHtml(q,q.ans)}</span>${note?`<br><span class="small">${note}</span>`:""}</div>`;
      if(q.dir==="dt") autoSay(q.card);
      setTimeout(()=>{ if(qs[qi]===q&&done) next(); },note?1600:900); }
    else { wrong.push({card:q.card,ask:askHtml(q),ans:ansHtml(q,q.ans),given:given?ansHtml(q,given):"-"}); deck.miss(q.card);
      $("#fbw").innerHTML=`<div class="fb wrong">${given?"Неверно.":"Правильный ответ:"} ${given?"Правильно:":""} <span class="ans">${ansHtml(q,q.ans)}</span>${note?`<br><span class="small">${note}</span>`:""}</div>
      ${given?`<button class="btn ghost small" id="ovr" style="margin-top:8px">Я ответил верно - засчитать</button>`:""}`;
      const o=$("#ovr"); if(o) o.onclick=()=>{ wrong.pop(); right++; const m=deck.progs[q.card.sid].miss; if(m[q.card.id]) m[q.card.id]--; next(); };
      if(q.dir==="dt") autoSay(q.card);
      $("#chk").focus(); }
  }
  function next(){ qi++; renderQ(); }
  setup();
}

/* ---------- Режим «Повторение» (интервальное) ---------- */
function viewReview(deck){
  const t=today();
  const due=deck.cards.filter(c=>{ const s=deck.srs(c); return s&&s.due<=t; }).sort((a,b)=>deck.srs(a).due-deck.srs(b).due);
  const fresh=deck.cards.filter(c=>!deck.srs(c));
  let newCount=Math.min(NEW_PER_SESSION,fresh.length);
  let queue=[], shown=false, cnt={done:0,again:0}, started=false;
  function intro(){
    app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p><h1>Повторение</h1>
      <div class="panel">
        <p style="margin-top:0">К повторению сегодня: <b>${due.length}</b>${fresh.length?` · новых карточек: <b>${fresh.length}</b>`:""}</p>
        ${fresh.length?`<label>Сколько новых добавить</label>${seg({n:String(newCount)},"n",[...[0,5,10,20].filter(v=>v<fresh.length).map(v=>[String(v),String(v)]),[String(fresh.length),"Все ("+fresh.length+")"]])}`:""}
        <p class="muted small">Сайт показывает карточку в тот день, когда вы вот-вот её забудете: трудные - чаще, лёгкие - через всё более длинные промежутки. Достаточно заниматься понемногу каждый день.</p>
        <button class="btn primary" id="go" ${due.length+newCount?"":"disabled"}>Начать (${due.length+newCount})</button></div>`;
    $$("[data-o]").forEach(b=>b.onclick=()=>{ newCount=+b.dataset.v; intro(); });
    $("#go").onclick=()=>{ queue=[...shuffle(due),...shuffle(fresh).slice(0,newCount)]; started=true; show(); };
    if(!due.length&&!fresh.length) nextDate();
  }
  function nextDate(){
    const ds=deck.cards.map(c=>deck.srs(c)?.due).filter(x=>x!=null);
    const nd=ds.length?Math.min(...ds):null;
    $("#go").insertAdjacentHTML("beforebegin",`<div class="note">На сегодня всё повторено.${nd!=null?` Следующее повторение: <b>${nd<=t+1?"завтра":fmtDay(nd)}</b>.`:""}</div>`);
  }
  function show(){
    if(!queue.length) return finish();
    shown=false; const c=queue[0], st=deck.srs(c);
    const front=`<div><div${termCls(c.t)}>${esc(c.t)}</div>${settings.pron==="front"?pronHtml(c):""}</div>`;
    const back=`<div><div style="font-size:${[...c.t].length<=3?"1.8em":".8em"}">${esc(c.t)}</div>${c.p?`<div class="pron" style="margin:4px 0 14px">${toneHtml(c.p)}</div>`:`<div style="height:12px"></div>`}<div>${esc(c.d)}</div></div>`;
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="muted small">осталось ${queue.length}${st?"":" · новая"}</span></div>
      <div class="flip noanim" id="card"><div class="inner">
        <div class="face front"><span class="hint">${st?"Вспомните ответ":"Новая карточка"}</span>${spkBtn(c)}${front}</div>
        <div class="face back"><span class="hint">Ответ</span>${spkBtn(c)}${back}</div></div></div>
      <div id="ctl"><button class="btn primary" id="sh" style="width:100%;margin-top:14px">Показать ответ</button></div>
      <p class="center muted small" style="margin:8px 0 0">${matchMedia("(hover:none)").matches?"Нажмите на карточку или кнопку":"Пробел - показать ответ, 1-4 - оценка, S - озвучить"}</p>`;
    requestAnimationFrame(()=>$("#card")?.classList.remove("noanim"));
    autoSay(c);
    $("#card").onclick=reveal; $("#sh").onclick=reveal;
  }
  function reveal(){
    if(shown) return; shown=true; const c=queue[0], st=deck.srs(c);
    $("#card").classList.add("flipped");
    const g=[0,1,2,3].map(k=>k===0?"сейчас":ivLabel(nextSrs(st,k).int));
    $("#ctl").innerHTML=`<div class="grades">
      <button class="btn dont" data-g="0">Не помню<small>${g[0]}</small></button><button class="btn hard" data-g="1">Трудно<small>${g[1]}</small></button>
      <button class="btn know" data-g="2">Помню<small>${g[2]}</small></button><button class="btn easy" data-g="3">Легко<small>${g[3]}</small></button></div>`;
    $$("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  }
  function grade(g){
    const c=queue.shift(), ns=nextSrs(deck.srs(c),g);
    deck.setSrs(c,ns); recordAnswer(g>0);
    if(g===0){ queue.splice(Math.min(queue.length,3),0,c); cnt.again++; deck.miss(c); deck.setKnown(c,false); }
    else { cnt.done++; if(g>=2) deck.setKnown(c,true); }
    show();
  }
  function finish(){
    deck.flushAll();
    const ds=deck.cards.map(c=>deck.srs(c)?.due).filter(x=>x!=null&&x>t), nd=ds.length?Math.min(...ds):null;
    app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p>
      <div class="panel center" style="padding:30px 20px"><h1>Готово!</h1>
      <p>Повторено карточек: <b>${cnt.done}</b>${cnt.again?` · пришлось вспоминать заново: <b>${cnt.again}</b>`:""}</p>
      ${nd!=null?`<p class="muted">Следующее повторение: <b>${nd<=t+1?"завтра":fmtDay(nd)}</b></p>`:""}
      <p class="muted small">Серия занятий: ${plural(streak(),"день","дня","дней")} подряд</p>
      <div class="row" style="justify-content:center;margin-top:16px"><a class="btn primary" href="${deck.back}">Готово</a><a class="btn" href="#/stats">Статистика</a></div></div>`;
  }
  const key=e=>{
    if(!started||!queue.length||e.target.matches("input,textarea,select")) return;
    if(e.code==="Space"||e.key==="Enter"){ e.preventDefault(); reveal(); }
    else if(shown&&/^[1-4]$/.test(e.key)) grade(+e.key-1);
    else if(e.key==="s"||e.key==="ы"){ const c=queue[0]; speak(c.t,langFor(c.t,c.lang)); }
  };
  document.addEventListener("keydown",key); cleanup=()=>document.removeEventListener("keydown",key);
  intro();
}

/* ---------- Статистика ---------- */
async function viewStats(){
  if(!user) return needAuth();
  loading(); flushStats();
  const [mine,st]=await Promise.all([mySetsC(),store.studying()]);
  const ids=new Set(mine.map(s=>s.id));
  const others=(await Promise.all(st.filter(x=>!ids.has(x.id)).map(x=>getSetC(x.id)))).filter(Boolean);
  const pm=Object.fromEntries(st.map(x=>[x.id,x])), t=today();
  let total=0, known=0, long=0, due=0, inSrs=0; const hard=[];
  for(const s of [...mine,...others]){ const p=pm[s.id]||{}, kn=new Set(p.known||[]), srs=p.srs||{}, miss=p.miss||{};
    for(const c of s.cards){ total++; if(kn.has(c.id)) known++; const r=srs[c.id]; if(r){ inSrs++; if(r.int>=21) long++; if(r.due<=t) due++; }
      if(miss[c.id]) hard.push({c,s,n:miss[c.id]}); } }
  hard.sort((a,b)=>b.n-a.n);
  const days=[...Array(14)].map((_,k)=>t-13+k), vals=days.map(d=>stats.days[dayStr(d)]?.n||0), mx=Math.max(1,...vals);
  const week=days.slice(7).reduce((a,d)=>a+(stats.days[dayStr(d)]?.n||0),0), tdv=stats.days[dayStr(t)]||{n:0,ok:0};
  const wk=["вс","пн","вт","ср","чт","пт","сб"];
  app.innerHTML=`<p class="small"><a href="#/">← Все наборы</a></p><h1>Статистика</h1>
    <div class="tiles">
      <div class="panel tile"><b>${plural(streak(),"день","дня","дней")}</b><span class="muted small">серия занятий подряд</span></div>
      <div class="panel tile"><b>${tdv.n}</b><span class="muted small">ответов сегодня${tdv.n?`, верно ${Math.round(tdv.ok/tdv.n*100)}%`:""}</span></div>
      <div class="panel tile"><b>${week}</b><span class="muted small">ответов за 7 дней</span></div>
      <div class="panel tile"><b>${due}</b><span class="muted small">к повторению сейчас</span></div>
      <div class="panel tile"><b>${known} / ${total}</b><span class="muted small">карточек «знаю»</span></div>
      <div class="panel tile"><b>${long}</b><span class="muted small">в долгой памяти (интервал от 3 недель)</span></div>
    </div>
    <h2>Активность за 2 недели</h2>
    <div class="panel"><div class="bars">${vals.map((v,k)=>`<div class="${v?"":"z"}" style="height:${v?Math.max(4,v/mx*100):2}%" title="${fmtDay(days[k])}: ${v}"></div>`).join("")}</div>
      <div class="bars-l">${days.map(d=>`<span>${wk[new Date(d*864e5).getUTCDay()]}</span>`).join("")}</div></div>
    <h2>Самые трудные карточки</h2>
    ${hard.length?`<div class="panel" style="padding:4px 8px"><table>${hard.slice(0,15).map(h=>`<tr><td>${esc(h.c.t)}${pronHtml(h.c)}</td><td>${esc(h.c.d)}<br><span class="muted small">${esc(h.s.title)} · ошибок: ${h.n}</span></td></tr>`).join("")}</table></div>`
      :`<div class="panel muted">Пока нет ошибок - или вы ещё не занимались.</div>`}
    <p class="muted small">Учтены ${plural(inSrs,"карточка","карточки","карточек")} в интервальном повторении. Статистика ответов собирается с этого обновления.</p>`;
}

(async()=>{
