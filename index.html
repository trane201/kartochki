<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Карточки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4255ff">
<title>Карточки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='44' height='34' rx='6' fill='%23aab4ff'/%3E%3Crect x='14' y='8' width='44' height='34' rx='6' fill='%234255ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --text:#1e2235; --muted:#6b7089; --line:#e3e6f0;
  --accent:#4255ff; --accent-soft:#eef0ff; --ok:#18a76a; --ok-soft:#e6f7ef; --bad:#e5484d; --bad-soft:#fdecec;
  --warn:#c98400; --warn-soft:#fff5e0;
  --t1:#e0332f; --t2:#1f9a4a; --t3:#2563eb; --t4:#8b3fc4;
  --radius:14px; --shadow:0 2px 10px rgba(30,34,53,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1220;--panel:#1a1e30;--text:#eceefa;--muted:#9aa0bd;--line:#2b3048;
  --accent:#7d8bff;--accent-soft:#232a52;--ok:#3ccf8e;--ok-soft:#173528;--bad:#ff6b6f;--bad-soft:#3a1d22;--warn:#f0b443;--warn-soft:#3a2f17;
  --t1:#ff6b66;--t2:#4fd17f;--t3:#6ea2ff;--t4:#c58af2;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:19px;color:var(--text);display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:18px;border-radius:4px;background:var(--accent);box-shadow:-5px 4px 0 #aab4ff}
header .sp{flex:1}
header .who{color:var(--muted);font-size:14px;max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:26px;margin:4px 0 14px}
h2{font-size:19px;margin:26px 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.setcard{display:block;color:var(--text);position:relative;cursor:pointer}
.setcard b{display:block;font-size:17px;margin-bottom:4px;padding-right:22px;word-break:break-word}
.setcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.setcard .chk{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--panel)}
.setcard.sel .chk{background:var(--accent);border-color:var(--accent)}
.setcard.sel .chk::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.x{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=search],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:220px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}
.check input{width:20px;height:20px;margin-top:2px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:top;word-break:break-word}
td:first-child{font-weight:600;width:40%}
td.n{width:36px;color:var(--muted);font-weight:400}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0;display:flex}
.progress>i{display:block;height:100%;background:var(--ok)}
.progress>i.b{background:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode{text-align:left;padding:18px;cursor:pointer;font:inherit;color:var(--text);display:block}
.mode b{display:block;font-size:18px}
.big{font-size:2.6em;line-height:1.15}
.pron{font-size:.62em;color:var(--muted);margin-top:8px;font-style:italic}
td .pron{font-size:13px;margin-top:2px}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t0{color:var(--muted)}
.pron .t1,.pron .t2,.pron .t3,.pron .t4{font-style:normal;font-weight:600}
/* flip card */
.study-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.flip{perspective:1400px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.flip .inner{position:relative;height:min(52vh,380px);transition:transform .45s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip.noanim .inner{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
  font-size:clamp(20px,4.6vw,30px);overflow:auto;word-break:break-word}
.face.back{transform:rotateY(180deg)}
.face .hint{position:absolute;top:12px;left:16px;font-size:13px;color:var(--muted)}
.flip.swl .face{border-color:var(--bad)} .flip.swr .face{border-color:var(--ok)}
.spk{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,color .2s}
.spk.playing{background:var(--accent);color:#fff;animation:spkpulse 1s ease-in-out infinite}
@keyframes spkpulse{0%,100%{box-shadow:0 0 0 0 rgba(66,85,255,.45)}50%{box-shadow:0 0 0 8px rgba(66,85,255,0)}}
/* iPhone (Safari) показывает элементы обратной стороны сквозь карточку - прячем значок на невидимой стороне в середине поворота */
.face .spk,.face .hint{-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:visibility 0s .2s,background .2s,color .2s}
.flip.flipped .face.front .spk,.flip.flipped .face.front .hint,.flip:not(.flipped) .face.back .spk,.flip:not(.flipped) .face.back .hint{visibility:hidden}
.spk.inline{position:static;width:36px;height:36px;vertical-align:middle;margin-left:6px}
.study-btns{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;margin-top:14px}
.btn.know{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.dont{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.hard{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.easy{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades .btn{flex-direction:column;gap:0;padding:8px 4px;line-height:1.2}
.grades .btn small{font-weight:400;font-size:12px;opacity:.85}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:52px;word-break:break-word}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
/* наведение мышью - только на компьютере, чтобы на телефоне не оставался контур после нажатия */
@media (hover:hover){
  .btn:hover{border-color:var(--accent)} .setcard:hover{border-color:var(--accent)} .mode:hover{border-color:var(--accent)}
  .opt:hover:not(:disabled){border-color:var(--accent)} .iconb:hover,.starb:hover{color:var(--accent)} .sres:hover{background:var(--accent-soft)}
}
.opt:focus{outline:none}
.question{transition:background .2s,border-color .2s}
.question.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok)}
.question.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 2px var(--bad)}
.reveal-card{margin-top:8px;color:var(--text);font-size:17px}
.reveal-card .rv-t{font-size:24px;font-weight:700}
.reveal-card .rv-p{font-size:17px}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;min-width:22px;color:var(--muted);font-weight:600}
.question{font-size:clamp(20px,4.2vw,26px);padding:26px 20px;text-align:center;word-break:break-word;position:relative}
.answer-in{font-size:20px;padding:14px 16px;margin-top:14px}
.answer-in.right{border-color:var(--ok);background:var(--ok-soft)}
.answer-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:16px}
.fb.right{background:var(--ok-soft);color:var(--ok)}
.fb.wrong{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--text);font-weight:600;font-size:20px}
.score{font-size:44px;font-weight:800;margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap;max-width:100%;vertical-align:middle}
.seg button{border:0;background:var(--panel);color:var(--text);font:inherit;padding:9px 14px;cursor:pointer;min-height:42px;flex:1 1 auto;box-shadow:0 0 0 .5px var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.opts-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;margin-top:18px}
.opts-row>span{display:inline-flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile b{display:block;font-size:28px;line-height:1.1}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.z{background:var(--line)}
.bars-l{display:flex;gap:4px;font-size:11px;color:var(--muted)}
.bars-l span{flex:1;text-align:center}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.starb{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 6px;min-width:36px;min-height:36px}
.starb.on{color:#f5a623}
.iconb{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px;min-width:36px;min-height:36px}
td.acts{width:84px;text-align:right;white-space:nowrap;padding:4px}
.note-txt{font-size:14px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.face .note-txt{font-size:15px;margin-top:12px}
.decomp{font-size:14px;color:var(--text);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);text-align:left;line-height:1.6}
.decomp b{font-size:18px}
.face .decomp{font-size:14px}
.cedit{display:grid;gap:8px;padding:8px 0}
.cedit input,.cedit textarea{padding:8px 10px}
.cedit textarea{min-height:60px;font-family:inherit;font-size:15px}
.match{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mt{min-height:96px;border:2px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;font:inherit;font-size:15px;padding:8px;cursor:pointer;
  word-break:break-word;transition:opacity .3s,transform .3s,border-color .15s,background .15s}
.mt.term{font-size:26px}
.opt .big-opt{font-size:26px}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.mt.done{opacity:0;transform:scale(.85);pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bigplay{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin:6px auto}
.bigplay svg{width:40px;height:40px}
.bigplay.spk{position:static;width:96px;height:96px;background:var(--accent);color:#fff}
.bigplay.playing{animation:spkpulse 1s ease-in-out infinite}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mic svg{width:40px;height:40px}
.mic.on{animation:micpulse 1s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
.reveal{margin-top:12px;text-align:center}
.reveal .pron{font-size:17px}
tr.dec-row .decomp{margin-top:0}
.folder-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sres{display:block;color:var(--text);padding:10px 12px;border-top:1px solid var(--line)}
.sres:first-child{border-top:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1e2235;color:#fff;
  padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.spin{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  h1{font-size:22px}
  .modes{grid-template-columns:1fr 1fr}
  .mode{padding:14px}
  .mode b{font-size:16px}
  .study-btns{grid-template-columns:1fr 1fr}
  .study-btns .nav{display:none}
  .seg button{padding:8px 11px;font-size:14px}
  header .who{display:none}
  .match{grid-template-columns:repeat(3,1fr);gap:8px}
  .mt{min-height:84px;font-size:14px}
  .mt.term{font-size:24px}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/"><i></i>Карточки</a>
  <span class="sp"></span>
  <span id="hdr" class="row"></span>
</header>
<main id="app"><div class="spin">Загрузка…</div></main>
<div id="toast"></div>

<!-- Настройки Firebase лежат в config.js (window.FIREBASE_CONFIG). Если файла нет - сайт работает в демо-режиме. -->
<script src="config.js"></script>
<script type="module">
const firebaseConfig = window.FIREBASE_CONFIG || {};

const FB_VERSION = "10.12.2";
const ADMIN_EMAIL = "trane201@mail.ru";   // наборы этого пользователя видны всем ("Общие наборы")
const isAdmin = () => !!user && (user.email||"").toLowerCase()===ADMIN_EMAIL;
const NEW_PER_SESSION = 10;          // новых карточек за одно повторение
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
let store, user = null, cleanup = null, afterLogin = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2600); }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(36); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function plural(n, one, few, many){ const m10=n%10, m100=n%100; return n+" "+(m10===1&&m100!==11?one:m10>=2&&m10<=4&&(m100<10||m100>=20)?few:many); }
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const LS = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const tzMs = () => new Date().getTimezoneOffset()*6e4;
const today = () => Math.floor((Date.now()-tzMs())/864e5);              // номер текущего дня (локально)
const dayStr = n => new Date(n*864e5).toISOString().slice(0,10);         // номер дня -> "2026-11-24"
const fmtDay = n => new Date(n*864e5).toLocaleDateString("ru-RU",{day:"numeric",month:"short",timeZone:"UTC"});

/* ---------- Настройки (в браузере) ---------- */
const settings = { tones:true, autoSpeak:false, front:"t", pron:"front", shuffle:false, onlyNew:false, decomp:false, sound:true, showPron:true, sayAsk:true, toneSound:false, ...LS.get("kartochki_settings",{}) };
const saveSettings = () => LS.set("kartochki_settings", settings);

/* ---------- Пиньинь: тоны, цвета, сравнение ---------- */
const TONE_MAP={};
"āáǎà a|ēéěè e|īíǐì i|ōóǒò o|ūúǔù u|ǖǘǚǜ ü".split("|").forEach(g=>{ const [m,b]=g.split(" "); [...m].forEach((ch,i)=>TONE_MAP[ch]=[b,i+1]); });
const VOW="aeiouüvāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ";
const SYL_RE=new RegExp(`(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?[${VOW}]+(?:ng(?![${VOW}])|n(?![${VOW}])|r(?![${VOW}]))?[1-5]?`,"gi");
const isPinyin = s => /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(s) || /[a-zü]+[1-5]\b/i.test(s);
function sylTone(syl){ const d=syl.match(/[1-5]$/); if(d) return +d[0]%5; for(const ch of syl) if(TONE_MAP[ch.toLowerCase()]) return TONE_MAP[ch.toLowerCase()][1]; return 0; }
function toneHtml(s){
  if(!settings.tones||!isPinyin(s)) return esc(s);
  let out="", last=0; s.replace(SYL_RE,(m,off)=>{ out+=esc(s.slice(last,off))+`<span class="t${sylTone(m)}">${esc(m)}</span>`; last=off+m.length; return m; });
  return out+esc(s.slice(last));
}
function pinyinKey(s, withTones){
  let out=""; for(const syl of (s.toLowerCase().replace(/u:/g,"ü").match(SYL_RE)||[])){
    let base="", tone=0; for(const ch of syl){ if(TONE_MAP[ch]){ base+=TONE_MAP[ch][0]; tone=TONE_MAP[ch][1]; } else if(/[1-5]/.test(ch)) tone=+ch%5; else base+=ch; }
    out+=base.replace(/ü/g,"v")+(withTones&&tone?tone:"")+"|";
  } return out;
}

function nextSrs(st, grade){                   // grade: 0 не помню, 1 трудно, 2 помню, 3 легко
  st={reps:0,int:0,ease:2.5,lapses:0,...(st||{})};
  if(grade===0) return {reps:0,int:0,ease:Math.max(1.3,st.ease-0.2),lapses:st.lapses+1,due:today()};
  let int;
  if(st.reps===0) int=[0,1,1,3][grade];
  else if(st.reps===1) int=[0,2,3,5][grade];
  else int=Math.round(st.int*[0,1.2,st.ease,st.ease*1.3][grade]);
  int=Math.max(1,Math.min(int,3650));
  if(st.reps>=1&&int<=st.int&&grade>=2) int=st.int+1;
  return {reps:st.reps+1,int,ease:Math.max(1.3,st.ease+[0,-0.15,0,0.15][grade]),lapses:st.lapses,due:today()+int};
}

async function loadDeck(idsStr, starOnly){

  await Promise.all(sets.map(async s=>{ const p=await store.getProgress(s.id);
    progs[s.id]={known:new Set(p.known||[]),srs:p.srs||{},miss:p.miss||{},starred:new Set(p.starred||[])}; own[s.id]=!!user&&s.ownerId===user.uid; }));
  let cards=[]; sets.forEach(s=>s.cards.forEach(c=>cards.push({...c,sid:s.id,lang:s.lang||"auto"})));

  const flush=sid=>{ clearTimeout(timers[sid]); delete timers[sid]; const p=progs[sid], s=sets.find(x=>x.id===sid);
    store.saveProgress(sid,{known:[...p.known],srs:p.srs,miss:p.miss,starred:[...p.starred],...(own[sid]?{}:{title:s.title,opened:Date.now()})}); };
  const deck={
    ids:sets.map(s=>s.id), sets, cards, progs, idsStr, starOnly:!!starOnly, q:starOnly?"/star":"",
    title: (idsStr==="all"?"Все наборы":sets.length===1?sets[0].title:plural(sets.length,"набор","набора","наборов"))+(starOnly?" · ★":""),
    back: sets.length===1&&idsStr!=="all"?`#/set/${sets[0].id}`:"#/",
    isKnown:c=>progs[c.sid].known.has(c.id),
    setKnown(c,v){ v?progs[c.sid].known.add(c.id):progs[c.sid].known.delete(c.id); this.save(c.sid); },
    srs:c=>progs[c.sid].srs[c.id],
    setSrs(c,st){ progs[c.sid].srs[c.id]=st; this.save(c.sid); },
    isStar:c=>progs[c.sid].starred.has(c.id),
    toggleStar(c){ const st=progs[c.sid].starred, on=!st.has(c.id); on?st.add(c.id):st.delete(c.id); this.save(c.sid); return on; },
    miss(c){ const m=progs[c.sid].miss; m[c.id]=(m[c.id]||0)+1; this.save(c.sid); },
    save(sid){ clearTimeout(timers[sid]); timers[sid]=setTimeout(()=>flush(sid),700); },
    flushAll(){ Object.keys(timers).forEach(flush); }
  };
  return deck;
}

/* ---------- Разбор вставленного списка ---------- */
const SEP_RE={tab:/\t+/, eq:/\s*=\s*/, dash:/\s+[-–—]\s+|[–—]/, semicolon:/\s*;\s*/, colon:/\s*:\s*/, comma:/\s*,\s*/};
function splitN(line, re, n){
  const parts=[]; let rest=line;
  while(parts.length<n-1){ const m=rest.match(re); if(!m) break; parts.push(rest.slice(0,m.index)); rest=rest.slice(m.index+m[0].length); }
  parts.push(rest); return parts;
}
function splitLine(line, sep, n){
  if(sep!=="auto") return SEP_RE[sep].test(line)?splitN(line,SEP_RE[sep],n):null;
  // авто: на каждом шаге берём самый ранний из основных разделителей (табуляция, =, тире),
  // поэтому подходят и смешанные строки вида «丁=dīng — гвоздь»; ; и : - только если основных нет
  const parts=[]; let rest=line;
  while(parts.length<n-1){
    let best=null;
    for(const re of [SEP_RE.tab,SEP_RE.eq,SEP_RE.dash]){ const m=rest.match(re); if(m&&(!best||m.index<best.index)) best=m; }
    if(!best&&!parts.length) for(const re of [SEP_RE.semicolon,SEP_RE.colon]){ const m=rest.match(re); if(m){ best=m; break; } }
    if(!best) break;
    parts.push(rest.slice(0,best.index)); rest=rest.slice(best.index+best[0].length);
  }
  parts.push(rest);
  return parts.length>1?parts:null;
}
/* cols=2: термин | определение; cols=3: термин | произношение | определение
   (строка только из двух частей в режиме 3 тоже принимается - без произношения) */
function parseCards(text, sep, cols){
  const cards=[], bad=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    if(!raw.trim()) return;
    // заметка: всё после « // » или лишний столбец при табуляции
    let note=""; const ni=raw.indexOf(" // ");
    if(ni>=0){ note=raw.slice(ni+4).trim(); raw=raw.slice(0,ni); }
    else if(raw.includes("\t")){ const tp=raw.split("\t"); if(tp.length===cols+1&&tp[cols].trim()){ note=tp.pop().trim(); raw=tp.join("\t"); } }
    const parts=splitLine(raw.replace(/^\s+|\s+$/g,m=>m.replace(/[^\t]/g,"")), sep, cols);
    if(!parts||parts.length<2) return bad.push(i+1);
    const f=parts.map(x=>x.trim()), t=f[0], d=f[f.length-1], pr=f.length===3?f[1]:"";
    if(t&&d){ const c={id:hash(t+"\u0001"+d),t,d}; if(pr) c.p=pr; if(note) c.n=note; cards.push(c); } else bad.push(i+1);
  });
  return {cards,bad};
}

/* ---------- Поиск по всем карточкам ---------- */
async function search(qs, mine, other){
  const box=$("#sr"), sets=$("#sets"); if(!box) return;
  const q=qs.trim().toLowerCase();
  if(!q){ box.innerHTML=""; sets.style.display=""; return; }
  sets.style.display="none";
  const all=[...mine, ...(await Promise.all(other.map(s=>getSetC(s.id)))).filter(Boolean)];
  const qp=pinyinKey(q,false).replace(/\|/g,""), res=[];
  for(const s of all) for(const c of s.cards){
    const hit=c.t.toLowerCase().includes(q)||c.d.toLowerCase().includes(q)||(c.p&&(c.p.toLowerCase().includes(q)||(qp.length>=2&&pinyinKey(c.p,false).replace(/\|/g,"").includes(qp))));
    if(hit){ res.push({s,c}); if(res.length>=60) break; }
  }
  if($("#q")?.value.trim().toLowerCase()!==q) return;
  box.innerHTML=res.length?`<div class="panel" style="padding:4px">${res.map(({s,c})=>`<a class="sres" href="#/set/${s.id}"><b>${esc(c.t)}</b>${c.p?` <span class="pron" style="font-size:14px">${toneHtml(c.p)}</span>`:""} - ${esc(c.d)}<br><span class="muted small">${esc(s.title)}</span></a>`).join("")}</div>`
    :`<div class="panel muted">Ничего не найдено</div>`;
}

  "auth/invalid-credential":"Неверная почта или пароль","auth/wrong-password":"Неверная почта или пароль","auth/user-not-found":"Пользователь не найден",
  "auth/too-many-requests":"Слишком много попыток, попробуйте позже","auth/network-request-failed":"Нет соединения с интернетом",
  "auth/operation-not-allowed":"Вход по почте не включён в настройках Firebase (Authentication → Sign-in method)"}[c]||("Ошибка: "+c));
function viewLogin(){
  if(user){ location.hash=afterLogin||"#/"; afterLogin=null; return; }
  app.innerHTML=`<div class="panel" style="max-width:420px;margin:20px auto">
    <h1>Вход</h1>
    <form id="f"><label for="em">Почта</label><input type="email" id="em" autocomplete="email" required>
    <label for="pw">Пароль</label><input type="password" id="pw" autocomplete="current-password" minlength="6">
    <div class="row" style="margin-top:18px"><button class="btn primary" type="submit">Войти</button>
    <button class="btn" type="button" id="up">Зарегистрироваться</button></div></form>
    <p class="small"><a href="#" id="rs">Забыли пароль?</a></p><div id="e"></div></div>`;
  const em=$("#em"), pw=$("#pw"), e=$("#e");
  const run=async fn=>{ e.innerHTML=""; try{ await fn(); }catch(x){ e.innerHTML=`<div class="err">${esc(authErr(x.code||x.message))}</div>`; } };
  $("#f").onsubmit=ev=>{ ev.preventDefault(); run(()=>store.signIn(em.value.trim(),pw.value)); };
  $("#up").onclick=()=>run(()=>store.signUp(em.value.trim(),pw.value));
  $("#rs").onclick=ev=>{ ev.preventDefault(); if(!em.value.trim()) return e.innerHTML=`<div class="err">Введите почту, на неё придёт ссылка для сброса</div>`;
    run(async()=>{ await store.reset(em.value.trim()); toast("Письмо для сброса пароля отправлено"); }); };
}

  const j=useTab?"\t":" - ";

    <label for="ti">Название</label><input type="text" id="ti" maxlength="200" value="${esc(s.title)}" placeholder="Например: Китайский - урок 1">
    <label for="de">Описание <span class="muted small">(необязательно)</span></label><input type="text" id="de" maxlength="500" value="${esc(s.description)}">
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:200px"><label for="fo">Папка <span class="muted small">(необязательно)</span></label>
        <input type="text" id="fo" maxlength="80" list="fl" value="${esc(s.folder)}" placeholder="Например: Китайский"><datalist id="fl">${folders.map(f=>`<option value="${esc(f)}">`).join("")}</datalist></div>
      <div style="flex:1;min-width:200px"><label for="lg">Язык озвучки терминов</label>
        <select id="lg">${LANGS.map(([v,l])=>`<option value="${v}" ${s.lang===v?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <label for="tx">Карточки - по одной на строку</label>
    <div class="row" style="margin:0 0 8px"><span class="small muted">Формат строки:</span>
      <span class="seg" id="cols"><button data-c="2">термин - определение</button><button data-c="3">термин - произношение - определение</button></span></div>
    <p class="muted small" style="margin:0 0 8px" id="fh"></p>
    <p class="muted small" style="margin:0 0 8px">Заметку или пример можно добавить в конце строки через <code> // </code>: <code>人=rén — человек // 我是中国人 - я китаец</code></p>
    <div class="row" style="margin:0 0 8px"><button class="btn small" type="button" id="impb">Загрузить из файла (Excel, CSV, TXT)</button><input type="file" id="impf" accept=".xlsx,.csv,.tsv,.txt" hidden><span class="muted small" id="impi"></span></div>
    <textarea id="tx">${esc(text)}</textarea>
    <div class="row" style="margin-top:10px"><span class="small muted">Разделитель:</span>
      <select id="sp" style="width:auto"><option value="auto">Определить автоматически</option><option value="tab">Табуляция (Excel, Quizlet)</option>
      <option value="dash">Тире  -  или  —</option><option value="eq">Знак =</option><option value="semicolon">Точка с запятой ;</option><option value="colon">Двоеточие :</option><option value="comma">Запятая ,</option></select></div>

      :`<label class="check"><input type="checkbox" id="pb" ${s.public?"checked":""}><span>Доступ по ссылке<br><span class="muted small">Любой, у кого есть ссылка, сможет учить этот набор. Изменять его можете только вы.</span></span></label>`}
  </div>

  $$("#cols button").forEach(b=>b.onclick=()=>{ setCols(+b.dataset.c); upd(); });

      else{

        setCols(three?3:2); $("#sp").value="tab";
      }
      upd(); $("#impi").textContent=`Загружено из «${f.name}». Проверьте предпросмотр и сохраните.`;
    }catch(x){ $("#impi").textContent=""; toast("Не удалось прочитать файл: "+(x.message||x)); }
  };
  $("#sv").onclick=async()=>{
    const {cards}=upd(), title=$("#ti").value.trim(), e=$("#e"); e.innerHTML="";
    // сохраняем прежние id карточек, чтобы не терялся прогресс при правке
    const byTD=new Map(), byT=new Map(), used=new Set();
    (s.cards||[]).forEach(c=>{ byTD.set(c.t+"\u0001"+c.d,c.id); (byT.get(c.t)||byT.set(c.t,[]).get(c.t)).push(c.id); });
    cards.forEach((c,k)=>{ let pid=byTD.get(c.t+"\u0001"+c.d); if(!pid||used.has(pid)) pid=(byT.get(c.t)||[]).find(x=>!used.has(x)); if(pid&&!used.has(pid)) c.id=pid; if(used.has(c.id)) c.id=c.id+"_"+k; used.add(c.id); });
    if(!title) return e.innerHTML=`<div class="err">Введите название</div>`;
    if(!cards.length) return e.innerHTML=`<div class="err">Добавьте хотя бы одну карточку</div>`;
    if(cards.length>2000) return e.innerHTML=`<div class="err">Максимум 2000 карточек в наборе - разделите на несколько</div>`;
    $("#sv").disabled=true;
    try{ const nid=await store.saveSet({...s,id,title,description:$("#de").value.trim(),folder:$("#fo").value.trim(),lang:$("#lg").value,cards,public:$("#pb").checked});
      setCache.delete(nid); toast(navigator.onLine?"Сохранено":"Сохранено на устройстве - отправится, когда появится интернет"); location.hash="#/set/"+nid; }
    catch(x){ $("#sv").disabled=false; e.innerHTML=`<div class="err">Не удалось сохранить: ${esc(x.message)}</div>`; }
  };
}

/* ---------- Режим «Карточки» ---------- */
function viewCards(deck){
  const opt=settings, withPron=hasPron(deck.cards);
  let order=[], i=0, flipped=false, round={k:0,u:0}, unknown=[];
  const start=(list)=>{
    let cards=list||deck.cards;
    if(!list&&opt.onlyNew){ const f=cards.filter(c=>!deck.isKnown(c)); if(f.length) cards=f; else toast("Все карточки уже выучены - показываю все"); }
    order=opt.shuffle?shuffle(cards):cards.slice(); i=0; flipped=false; round={k:0,u:0}; unknown=[]; render(true);
  };
  function render(say){
    if(i>=order.length) return renderEnd();
    const c=order[i], term=`<div><div${termCls(c.t)}>${esc(c.t)}</div>`, def=`<div>${esc(c.d)}</div>`, extra=noteHtml(c)+decompHtml(c,deck);
    if(opt.decomp&&!HANZI&&hasCJK([c])) { const lv=alive(); loadHanzi().then(()=>{ if(lv()&&order[i]===c) render(); }); }
    const F=opt.front==="t"
      ? [term+(opt.pron==="front"?pronHtml(c):"")+`</div>`, (opt.pron==="back"&&c.p?`<div class="pron" style="margin:0 0 12px">${toneHtml(c.p)}</div>`:"")+def+extra, "Термин", c.p&&opt.pron==="back"?"Произношение и определение":"Определение", spkBtn(c), spkBtn(c)]
      : [def, term+pronHtml(c)+extra+`</div>`, "Определение", "Термин", spkBtn(c), spkBtn(c)];
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="row" style="gap:4px">${starHtml(deck.isStar(c))}<span class="muted small">${i+1} / ${order.length}</span></span></div>
      <div class="flip noanim ${flipped?"flipped":""}" id="card"><div class="inner">
        <div class="face front"><span class="hint">${F[2]}${deck.isKnown(c)?" · знаю":""}</span>${F[4]}<div>${F[0]}</div></div>
        <div class="face back"><span class="hint">${F[3]}</span>${F[5]}<div>${F[1]}</div></div></div></div>
      <p class="center muted small" style="margin:8px 0 0">Нажмите на карточку, чтобы перевернуть${matchMedia("(hover:none)").matches?" · смахните вправо - знаю, влево - не знаю":" · пробел, ← →, 1 - не знаю, 2 - знаю, S - озвучить"}</p>
      <div class="study-btns"><button class="btn nav" id="pv" ${i?"":"disabled"}>←</button><button class="btn dont" id="no">Не знаю</button><button class="btn know" id="yes">Знаю</button><button class="btn nav" id="nx">→</button></div>
      <div class="opts-row"><span><span class="small muted">Сначала:</span>${seg(opt,"front",[["t","Термин"],["d","Определение"]])}</span>
      ${withPron&&opt.front==="t"?`<span><span class="small muted">Произношение:</span>${seg(opt,"pron",[["front","Сразу"],["back","После переворота"]])}</span>`:""}
      ${seg(opt,"shuffle",[[false,"По порядку"],[true,"Перемешать"]])}${seg(opt,"onlyNew",[[false,"Все"],[true,"Только невыученные"]])}
      ${canSpeak?`<span><span class="small muted">Озвучка:</span>${seg(opt,"autoSpeak",[[false,"По кнопке"],[true,"Сама"]])}</span>`:""}
      ${withPron?`<span><span class="small muted">Тоны:</span>${seg(opt,"tones",[[true,"Цветом"],[false,"Без цвета"]])}</span>`:""}
      ${hasCJK(deck.cards)?`<span><span class="small muted">Разбор:</span>${seg(opt,"decomp",[[false,"Выкл"],[true,"Вкл"]])}</span>`:""}</div>`;
    requestAnimationFrame(()=>$("#card")?.classList.remove("noanim"));
    if(say&&opt.front==="t") autoSay(c);
    wireStar($(".study-top .starb"),deck,c);
    const card=$("#card");
    let sx=null, sy=null, swiped=false;
    card.onclick=()=>{ if(swiped){ swiped=false; return; } flip(); };
    card.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    card.addEventListener("touchmove",e=>{ if(sx===null) return; const dx=e.touches[0].clientX-sx;
      card.classList.toggle("swr",dx>50); card.classList.toggle("swl",dx<-50); },{passive:true});
    card.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
      card.classList.remove("swr","swl"); if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){ swiped=true; mark(dx>0); } });
    $("#no").onclick=()=>mark(false); $("#yes").onclick=()=>mark(true);
    $("#pv").onclick=()=>{ if(i>0){ i--; flipped=false; render(true); } };
    $("#nx").onclick=()=>{ i++; flipped=false; render(true); };
    bindSeg(opt,k=>{ saveSettings(); if(["front","pron","autoSpeak","tones","decomp"].includes(k)) render(); else start(); });
  }
  function flip(){ flipped=!flipped; $("#card")?.classList.toggle("flipped",flipped); if(flipped&&opt.front==="d") autoSay(order[i]); }
  function mark(k){
    const c=order[i]; if(!c) return;
    deck.setKnown(c,k); recordAnswer(k);
    if(k) round.k++; else { round.u++; unknown.push(c); deck.miss(c); }
    i++; flipped=false; render(true);
  }
  function renderEnd(){
    const total=deck.cards.length, kn=deck.cards.filter(deck.isKnown).length;
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a></div>
      <div class="panel center" style="padding:30px 20px"><h1>Круг пройден</h1>
      <p>Знаю: <b style="color:var(--ok)">${round.k}</b> · Ещё учить: <b style="color:var(--bad)">${round.u}</b></p>
      <div class="progress" style="max-width:360px;margin:12px auto"><i style="width:${Math.round(kn/total*100)}%"></i></div>
      <p class="muted small">Всего знаю ${kn} из ${total}</p>
      <div class="row" style="justify-content:center;margin-top:16px">
        ${unknown.length?`<button class="btn primary" id="ag">Повторить невыученные (${unknown.length})</button>`:""}
        <button class="btn" id="re">Начать сначала</button><a class="btn" href="#/study/${deck.idsStr}/test${deck.q}">Пройти тест</a></div></div>`;
    const ag=$("#ag"); if(ag) ag.onclick=()=>start(opt.shuffle?shuffle(unknown):unknown.slice());
    $("#re").onclick=()=>start();
  }
  const key=e=>{
    if(e.target.matches("input,textarea,select")||i>=order.length) return;
    if(e.code==="Space"||e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); flip(); }
    else if(e.key==="ArrowRight"){ i++; flipped=false; render(true); }
    else if(e.key==="ArrowLeft"&&i>0){ i--; flipped=false; render(true); }
    else if(e.key==="1") mark(false); else if(e.key==="2") mark(true);
    else if(e.key==="s"||e.key==="ы"){ const c=order[i]; speak(c.t,langFor(c.t,c.lang)); }
  };
  document.addEventListener("keydown",key); cleanup=()=>{ document.removeEventListener("keydown",key); };
  start();
}

/* ---------- Звуки ответа (без файлов, синтез в браузере) ---------- */
let actx=null;
function sfx(ok){
  if(!settings.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t0=actx.currentTime+0.01;
    const notes=ok?[[659.3,0,.16],[987.8,.1,.34]]:[[220,0,.2],[164.8,.17,.4]];
    for(const [f,d,len] of notes){
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=ok?"triangle":"sawtooth"; o.frequency.setValueAtTime(f,t0+d);
      g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(ok?0.32:0.1,t0+d+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+len);
      o.connect(g); g.connect(actx.destination); o.start(t0+d); o.stop(t0+d+len+0.03);
    }
  }catch{}
}
const soundSeg=()=>`<label>Звуки ответа</label>${seg(settings,"sound",[[true,"Вкл"],[false,"Выкл"]])}`;
const nSeg=(opt,N,vals=["10","20"])=>seg(opt,"n",[...vals.filter(v=>+v<N).map(v=>[v,v]),["all","Все ("+N+")"]]);
const modeHead=(deck,t)=>`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p><h1>${t}</h1>`;
const needTwo=deck=>{ app.innerHTML=`<p class="small"><a href="${deck.back}">← Назад</a></p><div class="panel">Для этого режима нужно хотя бы 2 карточки.</div>`; };

/* ---------- Тоны пиньиня: разбор и варианты ---------- */
const MARKS={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
function parsePinyin(p){
  const out=[], s=String(p).replace(/u:/gi,"ü"); let last=0;
  s.replace(SYL_RE,(m,off)=>{ if(off>last) out.push({text:s.slice(last,off)});
    let base="", tone=0; for(const ch of m){ const k=TONE_MAP[ch.toLowerCase()]; if(k){ base+=ch===ch.toLowerCase()?k[0]:k[0].toUpperCase(); tone=k[1]; } else if(/[1-5]/.test(ch)) tone=+ch%5; else base+=ch==="v"?"ü":ch==="V"?"Ü":ch; }
    out.push({syl:true,base,tone}); last=off+m.length; return m; });
  if(last<s.length) out.push({text:s.slice(last)});
  return out;
}
function markSyl(base,tone){
  if(!tone) return base;
  const low=base.toLowerCase(); let i=low.indexOf("a"); if(i<0) i=low.indexOf("e"); if(i<0&&low.includes("ou")) i=low.indexOf("o");
  if(i<0) for(let k=low.length-1;k>=0;k--) if("iouü".includes(low[k])){ i=k; break; }
  if(i<0||!MARKS[low[i]]) return base;
  let mk=MARKS[low[i]][tone-1]; if(base[i]!==low[i]) mk=mk.toUpperCase();
  return base.slice(0,i)+mk+base.slice(i+1);
}
const buildPinyin=(parts,tones)=>{ let k=0; return parts.map(x=>x.syl?markSyl(x.base,tones[k++]):x.text).join(""); };
const toneable=c=>!!c.p&&isPinyin(c.p)&&parsePinyin(c.p).some(x=>x.syl&&x.tone);
function toneOptions(p){
  const parts=parsePinyin(p), syl=parts.filter(x=>x.syl), orig=syl.map(x=>x.tone), correct=buildPinyin(parts,orig);
  const mutable=syl.map((x,i)=>x.tone?i:-1).filter(i=>i>=0);
  const set=new Set([correct]); let tries=0;
  while(set.size<4&&tries++<80){ const t=orig.slice();
    shuffle(mutable).slice(0,1+Math.floor(Math.random()*Math.min(2,mutable.length))).forEach(i=>{ let nt; do{ nt=1+Math.floor(Math.random()*4); }while(nt===orig[i]); t[i]=nt; });
    set.add(buildPinyin(parts,t)); }
  return {correct, options:shuffle([...set])};
}

/* ---------- Типы вопросов ---------- */
const QT={
  td:{name:"Тест: термин → определение",need:()=>true},
  dt:{name:"Тест: определение → термин",need:()=>true},
  tp:{name:"Тест: термин → произношение",need:c=>!!c.p},
  lt:{name:"Аудирование: что прозвучало",need:()=>canSpeak},
  ld:{name:"Аудирование: перевод на слух",need:()=>canSpeak},
  tone:{name:"Тоны",need:toneable},
  wtp:{name:"Ввод: произношение",need:c=>!!c.p},
  wdt:{name:"Ввод: термин",need:()=>true},
  wtd:{name:"Ввод: перевод",need:()=>true}
};
const fieldHtml=(f,v)=>f==="p"?toneHtml(v):f==="t"?`<span class="${[...v].length<=3?"big-opt":""}">${esc(v)}</span>`:esc(v);
function makeQ(type,c,deck,o={}){
  const ex=!!o.exam, showPron=ex?false:settings.showPron, sayAsk=ex?true:settings.sayAsk;
  const term=withP=>`<div${termCls(c.t)}>${esc(c.t)}</div>${withP?pronHtml(c):""}`;
  if(type==="tone"){
    const to=toneOptions(c.p);
    return {type,kind:"choice",card:c,head:"Термин",prompt:"Выберите правильные тоны",askHtml:term(false)+`<div class="muted small" style="margin-top:8px">${esc(c.d)}</div>`,
      ans:to.correct,options:to.options,optHtml:v=>`<span style="font-size:22px">${toneHtml(v)}</span>`,say:ex?"none":settings.toneSound?"ask":"after",ansHtml:toneHtml(to.correct)};
  }
  if(["td","dt","tp","lt","ld"].includes(type)){
    const field={td:"d",dt:"t",tp:"p",lt:"t",ld:"d"}[type], listen=type==="lt"||type==="ld";
    const ans=c[field], pool=[...new Set(deck.cards.map(x=>x[field]).filter(Boolean))].filter(x=>x!==ans);
    const optHtml=v=>{ if(type==="dt"&&showPron){ const pc=deck.cards.find(x=>x.t===v&&x.p); return fieldHtml("t",v)+(pc?` <span class="muted small">${toneHtml(pc.p)}</span>`:""); } return fieldHtml(field,v); };
    const say=listen?"listen":type==="dt"?(ex?"none":"after"):type==="tp"?(ex?"none":sayAsk?"ask":"after"):(sayAsk?"ask":"after");
    return {type,kind:"choice",card:c,head:listen?"Прослушайте":type==="dt"?"Определение":"Термин",
      prompt:listen?(type==="lt"?"Что прозвучало?":"Что означает услышанное слово?"):"Выберите "+{td:"определение",dt:"термин",tp:"произношение"}[type],
      askHtml:listen?"":type==="dt"?esc(c.d):term(type==="td"&&showPron),ans,options:shuffle([ans,...shuffle(pool).slice(0,3)]),optHtml,say,ansHtml:fieldHtml(field,ans)};
  }
  const dir={wtp:"tp",wdt:"dt",wtd:"td"}[type], ans=dir==="tp"?c.p:dir==="dt"?c.t:c.d;
  return {type,kind:"write",card:c,dir,head:dir==="dt"?"Определение":"Термин",prompt:{tp:"Напишите произношение",dt:"Напишите термин",td:"Напишите перевод"}[dir],
    askHtml:dir==="dt"?esc(c.d):term(dir==="td"&&showPron),ans,ansHtml:dir==="tp"?toneHtml(ans):esc(ans),
    placeholder:{tp:"например ding1 или dīng",dt:"термин",td:"перевод"}[dir],
    say:dir==="td"?(sayAsk?"ask":"after"):(ex?"none":"after")};
}
function checkWrite(q,given,tonesReq){
  if(!String(given).trim()) return {ok:false,note:""};
  if(q.dir==="tp"){ const a0=pinyinKey(given,false), b0=pinyinKey(q.ans,false);
    const ok=tonesReq?pinyinKey(given,true)===pinyinKey(q.ans,true):a0===b0;
    return {ok, note:!ok&&a0&&a0===b0?"Слоги верные, но тоны другие.":""}; }
  const m=answerMatches(given,q.ans); return {ok:!!m,note:m==="typo"?"Засчитано с опечаткой.":""};
}
const qSummary=q=>`<b>${esc(q.card.t)}</b>${q.card.p&&!["tp","wtp","tone"].includes(q.type)?` <span class="muted small">${toneHtml(q.card.p)}</span>`:""}<br><span class="muted small">${esc(q.card.d)}</span><br><span class="muted small">${QT[q.type].name}</span>`;

/* ---------- Общий механизм вопросов: тест, ввод, аудирование, тоны, экзамен, бесконечный ---------- */
let quizKey=null;
function runQuiz(deck,cfg){
  const live=alive();
  let i=0, q=null, answered=false, selK=null, right=0, done=false;
  const wrong=[], log=[];
  function show(){
    if(!live()||done) return;
    q=cfg.next(i,log); if(!q) return finish();
    answered=false; selK=null;
    const listen=q.say==="listen", hoverless=matchMedia("(hover:none)").matches;
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="row" style="gap:4px">${cfg.exam?"":starHtml(deck.isStar(q.card))}<span class="muted small">${cfg.total?`${i+1} / ${cfg.total}`:`№ ${i+1} · верно ${right}`}</span>${cfg.endless?`<button class="btn small" id="stop">Стоп</button>`:""}</span></div>
      ${cfg.total?`<div class="progress"><i class="b" style="width:${i/cfg.total*100}%"></i></div>`:""}
      ${cfg.showType?`<div class="muted small" style="margin:4px 0 6px">${QT[q.type].name}</div>`:""}
      <div class="panel question" id="qp">${q.say==="ask"?spkBtn({...q.card,lang:q.card.lang==="off"?"auto":q.card.lang}):""}<div class="muted small" style="margin-bottom:8px">${q.head}</div>
        ${listen?`<button class="bigplay spk" data-say="${esc(q.card.t)}" data-lang="${esc(sayLang(q.card))}" aria-label="Прослушать">${PLAY_SVG}</button><div class="muted small">нажмите, чтобы прослушать ещё раз${hoverless?"":" (пробел)"}</div>`:q.askHtml}</div>
      <p class="muted small" style="margin:14px 0 0">${q.prompt}${q.kind==="choice"&&!hoverless?" · клавиши 1-4":""}</p>
      ${q.kind==="choice"?`<div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span> ${q.optHtml(o)}</button>`).join("")}</div>`
        :`<form id="af" autocomplete="off"><input type="text" class="answer-in" id="ans" placeholder="${q.placeholder}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
          <div class="row" style="margin-top:12px"><button class="btn primary" type="submit" id="chk">${cfg.exam?"Далее":"Ответить"}</button>${cfg.exam?"":`<button class="btn ghost" type="button" id="idk">Не знаю</button>`}</div></form>`}
      <div id="fb"></div><div id="nxw" class="row" style="margin-top:12px"></div>`;
    try{ document.activeElement&&document.activeElement.blur(); }catch{}
    if(!cfg.exam) wireStar($(".study-top .starb"),deck,q.card);
    const st=$("#stop"); if(st) st.onclick=finish;
    if(q.kind==="choice") $$(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    else { const inp=$("#ans"); setTimeout(()=>{ if(!answered) inp.focus(); },60);
      $("#af").onsubmit=e=>{ e.preventDefault(); if(answered) return next(); if(cfg.exam||inp.value.trim()) submit(inp.value); };
      const idk=$("#idk"); if(idk) idk.onclick=()=>{ if(!answered) submit(""); }; }
    if(listen) speak(q.card.t,sayLang(q.card)); else if(q.say==="ask") autoSay(q.card);
  }
  function choose(k){
    if(answered) return;
    if(cfg.exam){ selK=k; $$(".opt").forEach((b,j)=>b.classList.toggle("sel",j===k));
      $("#nxw").innerHTML=`<button class="btn primary" id="nx">Далее</button>`; $("#nx").onclick=()=>submit(q.options[selK]); return; }
    submit(q.options[k]);
  }
  function submit(given){
    if(answered) return; answered=true;
    let ok, note="";
    if(q.kind==="choice") ok=given===q.ans; else ({ok,note}=checkWrite(q,given,cfg.tonesReq!==false));
    recordAnswer(ok);
    const entry={q,ok,given}; log.push(entry);
    const givenHtml=given?(q.type==="tone"||q.dir==="tp"?toneHtml(given):q.kind==="choice"?q.optHtml(given):esc(given)):"-";
    if(ok) right++; else { deck.miss(q.card); wrong.push({card:q.card,type:q.type,ask:qSummary(q),ans:q.ansHtml,given:givenHtml}); }
    if(cfg.exam){ i++; return show(); }
    sfx(ok);
    $("#qp").classList.add(ok?"right":"wrong");
    if(q.kind==="choice") $$(".opt").forEach((b,j)=>{ b.disabled=true; if(q.options[j]===q.ans) b.classList.add("right"); else if(q.options[j]===given) b.classList.add("wrong"); });
    else { const inp=$("#ans"); inp.readOnly=true; inp.blur(); inp.classList.add(ok?"right":"wrong"); $("#chk").style.display="none"; const idk=$("#idk"); if(idk) idk.style.display="none"; }
    const c=q.card;
    $("#fb").innerHTML=`<div class="fb ${ok?"right":"wrong"}"><b>${ok?"Верно!":given?"Неверно":"Правильный ответ"}</b>${note?` <span class="small">${note}</span>`:""}
      <div class="reveal-card"><span class="rv-t">${esc(c.t)}</span>${c.p?` <span class="rv-p">${toneHtml(c.p)}</span>`:""} - ${esc(c.d)}</div></div>`;
    $("#nxw").innerHTML=`<button class="btn primary" id="nx">Далее</button>${!ok&&given&&q.kind==="write"?`<button class="btn ghost" id="ovr">Я ответил верно - засчитать</button>`:""}`;
    $("#nx").onclick=next; try{ $("#nx").focus({preventScroll:true}); }catch{}
    const ov=$("#ovr"); if(ov) ov.onclick=()=>{ wrong.pop(); right++; entry.ok=true; const m=deck.progs[c.sid].miss; if(m[c.id]) m[c.id]--; sfx(true); next(); };
    if(q.say!=="listen"&&q.say!=="none") autoSay(c);
  }
  function next(){ if(!answered) return; i++; show(); }
  function finish(){ if(done) return; done=true; if(quizKey){ document.removeEventListener("keydown",quizKey); quizKey=null; } cfg.onFinish({right,total:log.length,wrong,log}); }
  if(quizKey) document.removeEventListener("keydown",quizKey);
  quizKey=e=>{
    if(!q||done||e.target.matches("textarea,select")) return;
    if(e.target.matches("input")&&!(answered&&e.key==="Enter")) return;
    if(e.code==="Space"&&q.say==="listen"&&!answered){ e.preventDefault(); speak(q.card.t,sayLang(q.card)); return; }
    if(q.kind==="choice"&&!answered&&/^[1-4]$/.test(e.key)&&+e.key<=q.options.length){ choose(+e.key-1); return; }
    if(e.key==="Enter"){ if(answered){ e.preventDefault(); next(); } else if(cfg.exam&&selK!=null){ e.preventDefault(); submit(q.options[selK]); } }
  };
  document.addEventListener("keydown",quizKey);
  const prev=cleanup; cleanup=()=>{ if(quizKey){ document.removeEventListener("keydown",quizKey); quizKey=null; } done=true; prev&&prev(); };
  show();
}
/* Фиксированный список вопросов (тренажёры и экзамен) */
function runList(deck,makers,act,o={}){
  runQuiz(deck,{total:makers.length,exam:o.exam,tonesReq:o.tonesReq,showType:o.showType,next:i=>i<makers.length?makers[i]():null,
    onFinish:o.onFinish||(res=>renderResult(deck,res,{...act,redo:res.wrong.length?()=>runList(deck,res.wrong.map(w=>()=>makeQ(w.type,w.card,deck)),act,o):null}))});
}
function renderResult(deck,res,act){
  const {right,total,wrong}=res, pct=total?Math.round(right/total*100):0;
  app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p>
    <div class="panel center" style="padding:26px 20px"><div class="muted">${act.title||"Результат"}</div>
    <div class="score" style="color:${pct>=80?"var(--ok)":pct>=50?"var(--accent)":"var(--bad)"}">${pct}%</div>
    <p>Правильно ${right} из ${total}</p>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="ag">Повторить</button>
    ${act.redo?`<button class="btn" id="rw">Только ошибки (${wrong.length})</button>`:""}
    ${act.setup?`<button class="btn" id="stp">Настройки</button>`:""}<a class="btn ghost" href="${deck.back}">${deck.back==="#/"?"На главную":"К набору"}</a></div></div>
    ${wrong.length?`<h2>Ошибки</h2><div class="panel" style="padding:4px 8px"><table>${wrong.map(w=>`<tr><td>${w.ask}</td><td><span style="color:var(--ok)">${w.ans}</span><br><span class="muted small">ваш ответ: ${w.given}</span></td></tr>`).join("")}</table></div>`:""}`;
  $("#ag").onclick=act.again;

/* Тренажёр с настройками: общий каркас */
function trainer(deck,{title,key,defaults,form,types,intro,tonesReq}){
  const opt={n:"10",...defaults,...LS.get(key,{})};
  const setup=()=>{
    const N=pool().length; if(opt.n!=="all"&&+opt.n>=N) opt.n="all";
    app.innerHTML=modeHead(deck,title)+`<div class="panel">${intro?`<p class="muted small" style="margin-top:0">${intro}</p>`:""}${form(opt)}
      <label>Количество вопросов</label>${nSeg(opt,N)}${soundSeg()}
      <div style="margin-top:20px"><button class="btn primary" id="go">Начать</button></div></div>`;
    bindSeg(opt,()=>{ LS.set(key,opt); setup(); });
    $("#go").onclick=start;
  };
  const pool=()=>deck.cards.filter(c=>types(opt).some(t=>QT[t].need(c)));
  const start=()=>{
    const ts=types(opt), src=pool(), cards=shuffle(src).slice(0,opt.n==="all"?src.length:+opt.n);
    runList(deck,cards.map(c=>{ const ok=ts.filter(t=>QT[t].need(c)); const t=ok[Math.floor(Math.random()*ok.length)]; return ()=>makeQ(t,c,deck); }),
      {again:start,setup,title},{tonesReq:typeof tonesReq==="function"?tonesReq(opt):tonesReq});
  };
  setup();
}

/* ---------- Экзамен ---------- */
function viewExam(deck){
  if(deck.cards.length<2) return needTwo(deck);
  const opt={n:"20",match:true,...LS.get("kartochki_exam_opts",{})};
  const types=Object.keys(QT).filter(t=>deck.cards.some(QT[t].need));
  const seenT=new Set(), seenD=new Set(), uniq=deck.cards.filter(c=>{ if(seenT.has(c.t)||seenD.has(c.d)) return false; seenT.add(c.t); seenD.add(c.d); return true; });
  const maxN=types.reduce((a,t)=>a+deck.cards.filter(QT[t].need).length,0);
  const setup=()=>{
    if(opt.n!=="all"&&+opt.n>=maxN) opt.n="all";
    app.innerHTML=modeHead(deck,"Экзамен")+`<div class="panel">
      <p class="muted small" style="margin-top:0">Вопросы всех тренажёров вперемешку. Подсказок и проверки по ходу нет - оценка и разбор ошибок в конце.</p>
      <div class="row" style="gap:6px">${types.map(t=>`<span class="badge">${QT[t].name}</span>`).join("")}</div>
      <label>Количество вопросов</label>${seg(opt,"n",[...["10","20","30","50"].filter(v=>+v<maxN).map(v=>[v,v]),["all","Все ("+maxN+")"]])}
      ${uniq.length>=2?`<label>Раунд «Подбор» в конце</label>${seg(opt,"match",[[true,"Включить"],[false,"Без него"]])}`:""}
      <div style="margin-top:20px"><button class="btn primary" id="go">Начать экзамен</button></div></div>`;
    bindSeg(opt,()=>{ LS.set("kartochki_exam_opts",opt); setup(); });
    $("#go").onclick=start;
  };
  const start=()=>{
    const n=opt.n==="all"?maxN:+opt.n, used=new Map(), plan=[];
    let tq=shuffle(types);
    for(let k=0;k<n;k++){
      if(!tq.length) tq=shuffle(types);
      const t=tq.shift(), cand=deck.cards.filter(c=>QT[t].need(c)&&!used.has(c.sid+c.id+t));
      if(!cand.length){ if(plan.length+tq.length>=maxN) break; k--; continue; }
      const minUse=Math.min(...cand.map(c=>used.get(c.sid+c.id)||0)), pick=shuffle(cand.filter(c=>(used.get(c.sid+c.id)||0)===minUse))[0];
      used.set(pick.sid+pick.id+t,1); used.set(pick.sid+pick.id,(used.get(pick.sid+pick.id)||0)+1); plan.push([t,pick]);
      if(plan.length>=maxN) break;
    }
    runList(deck,plan.map(([t,c])=>()=>makeQ(t,c,deck,{exam:true})),{},{exam:true,tonesReq:true,showType:true,
      onFinish:res=>{ if(opt.match&&uniq.length>=2){
        app.innerHTML=modeHead(deck,"Экзамен")+`<div class="panel center" style="padding:26px 20px"><p>Вопросы закончились. Последний раунд - <b>«Подбор»</b>: соедините пары. Каждая ошибка снижает оценку.</p><button class="btn primary" id="mg">Начать подбор</button></div>`;
        $("#mg").onclick=()=>matchGame(deck,{exam:true,onDone:m=>examResult(res,m)});
      } else examResult(res,null); }});
  };
  const examResult=(res,m)=>{
    const mp=m?Math.max(0,m.pairs-m.miss):0, total=res.total+(m?m.pairs:0), score=res.right+mp, pct=total?Math.round(score/total*100):0;
    const grade=pct>=90?["Отлично","var(--ok)"]:pct>=75?["Хорошо","var(--ok)"]:pct>=50?["Удовлетворительно","var(--accent)"]:["Неудовлетворительно","var(--bad)"];
    const by={}; res.log.forEach(e=>{ const b=by[e.q.type]=by[e.q.type]||[0,0]; b[1]++; if(e.ok) b[0]++; });
    app.innerHTML=modeHead(deck,"Итог экзамена")+`<div class="panel center" style="padding:24px 20px"><div class="score" style="color:${grade[1]}">${pct}%</div>
      <p style="font-size:20px;margin:0 0 6px"><b>${grade[0]}</b></p><p class="muted">Набрано ${score} из ${total}</p>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="ag">Пройти ещё раз</button><button class="btn" id="stp">Настройки</button><a class="btn ghost" href="${deck.back}">${deck.back==="#/"?"На главную":"К набору"}</a></div></div>
      <h2>По тренажёрам</h2><div class="panel" style="padding:4px 8px"><table>${Object.entries(by).map(([t,[a,b]])=>`<tr><td>${QT[t].name}</td><td>${a} из ${b}</td></tr>`).join("")}
      ${m?`<tr><td>Подбор</td><td>${m.pairs} пар, ошибок ${m.miss} · ${(m.time/1000).toFixed(1).replace(".",",")} с → ${mp} из ${m.pairs}</td></tr>`:""}</table></div>
      ${res.wrong.length?`<h2>Ошибки</h2><div class="panel" style="padding:4px 8px"><table>${res.wrong.map(w=>`<tr><td>${w.ask}</td><td><span style="color:var(--ok)">${w.ans}</span><br><span class="muted small">ваш ответ: ${w.given}</span></td></tr>`).join("")}</table></div>`:`<p class="muted">Ошибок в вопросах нет.</p>`}`;
    $("#ag").onclick=start; $("#stp").onclick=setup;
  };
  setup();
}
/* ---------- Бесконечный режим ---------- */
function viewEndless(deck){
  if(deck.cards.length<2) return needTwo(deck);
  const groups=[["test","Тест",["td","dt","tp"]],["write","Ввод",["wtp","wdt","wtd"]],["listen","Аудирование",["lt","ld"]],["tones","Тоны",["tone"]]]
    .map(([k,l,ts])=>[k,l,ts.filter(t=>deck.cards.some(QT[t].need))]).filter(g=>g[2].length);
  const opt={sel:["test"],...LS.get("kartochki_endless_opts",{})};
  opt.sel=opt.sel.filter(k=>groups.some(g=>g[0]===k)); if(!opt.sel.length) opt.sel=[groups[0][0]];
  const setup=()=>{
    app.innerHTML=modeHead(deck,"Бесконечный режим")+`<div class="panel">
      <p class="muted small" style="margin-top:0">Вопросы выбранных тренажёров идут по кругу без конца, пока вы не нажмёте «Стоп». Карточки, на которых вы ошиблись, возвращаются через несколько вопросов.</p>
      <label>Тренажёры (можно несколько)</label><span class="seg">${groups.map(([k,l])=>`<button data-m="${k}" class="${opt.sel.includes(k)?"on":""}">${l}</button>`).join("")}</span>
      ${hasPron(deck.cards)?`<label>Пиньинь под термином</label>${seg(settings,"showPron",[[true,"Показывать"],[false,"Скрыть"]])}`:""}
      ${canSpeak?`<label>Озвучка в вопросе</label>${seg(settings,"sayAsk",[[true,"Вкл"],[false,"Выкл"]])}`:""}
      ${soundSeg()}
      <div style="margin-top:20px"><button class="btn primary" id="go">Начать</button></div></div>`;
    $$("[data-m]").forEach(b=>b.onclick=()=>{ const k=b.dataset.m; opt.sel=opt.sel.includes(k)?opt.sel.filter(x=>x!==k):[...opt.sel,k]; if(!opt.sel.length) opt.sel=[k]; LS.set("kartochki_endless_opts",opt); setup(); });
    bindSeg(opt,()=>setup());
    $("#go").onclick=start;
  };
  const start=()=>{
    const types=groups.filter(g=>opt.sel.includes(g[0])).flatMap(g=>g[2]);
    const cards=deck.cards.filter(c=>types.some(t=>QT[t].need(c)));
    let pending=[], recent=[], seen=0;
    runQuiz(deck,{endless:true,tonesReq:true,showType:types.length>1,
      next:(i,log)=>{
        if(log.length>seen){ const last=log[log.length-1]; seen=log.length; if(!last.ok) pending.push({c:last.q.card,at:i+2+Math.floor(Math.random()*3)}); }
        let c=null; const d=pending.findIndex(p=>p.at<=i);
        if(d>=0) c=pending.splice(d,1)[0].c;
        else { const pool=cards.filter(x=>!recent.includes(x)); c=(pool.length?pool:cards)[Math.floor(Math.random()*(pool.length||cards.length))]; }
        recent.push(c); if(recent.length>Math.min(4,cards.length-1)) recent.shift();
        const ts=types.filter(t=>QT[t].need(c));
        return makeQ(ts[Math.floor(Math.random()*ts.length)],c,deck);
      },
      onFinish:res=>renderResult(deck,res,{title:"Бесконечный режим - итог",again:start,setup,redo:null})});
  };
  setup();
}

/* ---------- Режим «Повторение» (интервальное) ---------- */
function viewReview(deck){
  const t=today();
  const due=deck.cards.filter(c=>{ const s=deck.srs(c); return s&&s.due<=t; }).sort((a,b)=>deck.srs(a).due-deck.srs(b).due);
  const fresh=deck.cards.filter(c=>!deck.srs(c));
  let newCount=Math.min(NEW_PER_SESSION,fresh.length);
  let queue=[], shown=false, cnt={done:0,again:0}, started=false;
  function intro(){
    app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p><h1>Повторение</h1>
      <div class="panel">
        <p style="margin-top:0">К повторению сегодня: <b>${due.length}</b>${fresh.length?` · новых карточек: <b>${fresh.length}</b>`:""}</p>
        ${fresh.length?`<label>Сколько новых добавить</label>${seg({n:String(newCount)},"n",[...[0,5,10,20].filter(v=>v<fresh.length).map(v=>[String(v),String(v)]),[String(fresh.length),"Все ("+fresh.length+")"]])}`:""}
        <p class="muted small">Сайт показывает карточку в тот день, когда вы вот-вот её забудете: трудные - чаще, лёгкие - через всё более длинные промежутки. Достаточно заниматься понемногу каждый день.</p>
        <button class="btn primary" id="go" ${due.length+newCount?"":"disabled"}>Начать (${due.length+newCount})</button></div>`;
    $$("[data-o]").forEach(b=>b.onclick=()=>{ newCount=+b.dataset.v; intro(); });
    $("#go").onclick=()=>{ queue=[...shuffle(due),...shuffle(fresh).slice(0,newCount)]; started=true; show(); };
    if(!due.length&&!fresh.length) nextDate();
  }
  function nextDate(){
    const ds=deck.cards.map(c=>deck.srs(c)?.due).filter(x=>x!=null);
    const nd=ds.length?Math.min(...ds):null;
    $("#go").insertAdjacentHTML("beforebegin",`<div class="note">На сегодня всё повторено.${nd!=null?` Следующее повторение: <b>${nd<=t+1?"завтра":fmtDay(nd)}</b>.`:""}</div>`);
  }
  function show(){
    if(!queue.length) return finish();
    shown=false; const c=queue[0], st=deck.srs(c);
    const front=`<div><div${termCls(c.t)}>${esc(c.t)}</div>${settings.pron==="front"?pronHtml(c):""}</div>`;
    if(settings.decomp&&!HANZI&&hasCJK([c])) { const lv=alive(); loadHanzi().then(()=>{ if(lv()&&queue[0]===c&&!shown) show(); }); }
    const back=`<div><div style="font-size:${[...c.t].length<=3?"1.8em":".8em"}">${esc(c.t)}</div>${c.p?`<div class="pron" style="margin:4px 0 14px">${toneHtml(c.p)}</div>`:`<div style="height:12px"></div>`}<div>${esc(c.d)}</div>${noteHtml(c)}${decompHtml(c,deck)}</div>`;
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="row" style="gap:4px">${starHtml(deck.isStar(c))}<span class="muted small">осталось ${queue.length}${st?"":" · новая"}</span></span></div>
      <div class="flip noanim" id="card"><div class="inner">
        <div class="face front"><span class="hint">${st?"Вспомните ответ":"Новая карточка"}</span>${spkBtn(c)}${front}</div>
        <div class="face back"><span class="hint">Ответ</span>${spkBtn(c)}${back}</div></div></div>
      <div id="ctl"><button class="btn primary" id="sh" style="width:100%;margin-top:14px">Показать ответ</button></div>
      <p class="center muted small" style="margin:8px 0 0">${matchMedia("(hover:none)").matches?"Нажмите на карточку или кнопку":"Пробел - показать ответ, 1-4 - оценка, S - озвучить"}</p>
      ${hasCJK(deck.cards)?`<div class="opts-row"><span><span class="small muted">Разбор:</span>${seg(settings,"decomp",[[false,"Выкл"],[true,"Вкл"]])}</span></div>`:""}`;
    requestAnimationFrame(()=>$("#card")?.classList.remove("noanim"));
    autoSay(c);
    wireStar($(".study-top .starb"),deck,c);
    bindSeg(settings,()=>{ saveSettings(); const was=shown; show(); if(was) reveal(); });
    $("#card").onclick=reveal; $("#sh").onclick=reveal;
  }
  function reveal(){
    if(shown) return; shown=true; const c=queue[0], st=deck.srs(c);
    $("#card").classList.add("flipped");
    const g=[0,1,2,3].map(k=>k===0?"сейчас":ivLabel(nextSrs(st,k).int));
    $("#ctl").innerHTML=`<div class="grades">
      <button class="btn dont" data-g="0">Не помню<small>${g[0]}</small></button><button class="btn hard" data-g="1">Трудно<small>${g[1]}</small></button>
      <button class="btn know" data-g="2">Помню<small>${g[2]}</small></button><button class="btn easy" data-g="3">Легко<small>${g[3]}</small></button></div>`;
    $$("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  }
  function grade(g){
    const c=queue.shift(), ns=nextSrs(deck.srs(c),g);
    deck.setSrs(c,ns); recordAnswer(g>0);
    if(g===0){ queue.splice(Math.min(queue.length,3),0,c); cnt.again++; deck.miss(c); deck.setKnown(c,false); }
    else { cnt.done++; if(g>=2) deck.setKnown(c,true); }
    show();
  }
  function finish(){
    deck.flushAll();
    const ds=deck.cards.map(c=>deck.srs(c)?.due).filter(x=>x!=null&&x>t), nd=ds.length?Math.min(...ds):null;
    app.innerHTML=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p>
      <div class="panel center" style="padding:30px 20px"><h1>Готово!</h1>
      <p>Повторено карточек: <b>${cnt.done}</b>${cnt.again?` · пришлось вспоминать заново: <b>${cnt.again}</b>`:""}</p>
      ${nd!=null?`<p class="muted">Следующее повторение: <b>${nd<=t+1?"завтра":fmtDay(nd)}</b></p>`:""}
      <p class="muted small">Серия занятий: ${plural(streak(),"день","дня","дней")} подряд</p>
      <div class="row" style="justify-content:center;margin-top:16px"><a class="btn primary" href="${deck.back}">Готово</a><a class="btn" href="#/stats">Статистика</a></div></div>`;
  }
  const key=e=>{
    if(!started||!queue.length||e.target.matches("input,textarea,select")) return;
    if(e.code==="Space"||e.key==="Enter"){ e.preventDefault(); reveal(); }
    else if(shown&&/^[1-4]$/.test(e.key)) grade(+e.key-1);
    else if(e.key==="s"||e.key==="ы"){ const c=queue[0]; speak(c.t,langFor(c.t,c.lang)); }
  };
  document.addEventListener("keydown",key); cleanup=()=>document.removeEventListener("keydown",key);
  intro();
}

/* ---------- Режим «Произношение» (распознавание речи) ---------- */
const MIC_SVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
function viewSpeak(deck){
  const live=alive();
  const back=`<p class="small"><a href="${deck.back}">← ${esc(deck.title)}</a></p>`;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ app.innerHTML=back+`<h1>Произношение</h1><div class="panel">Этот браузер не умеет распознавать речь. Подойдут Safari на iPhone (с включённой диктовкой в настройках клавиатуры) или Chrome на компьютере.</div>`; return; }
  const opt={n:"10",showPron:true,...LS.get("kartochki_speak_opts",{})};
  let qs=[], qi=0, right=0, wrong=[], rec=null, done=false;
  function setup(){
    const N=deck.cards.length; if(opt.n!=="all"&&+opt.n>=N) opt.n="all";
    app.innerHTML=back+`<h1>Произношение</h1><div class="panel">
      <p class="muted small" style="margin-top:0">Нажмите на микрофон и произнесите слово - браузер распознает речь и сравнит с карточкой. Тоны так проверяются лишь приблизительно: одиночный иероглиф иногда распознаётся как другой с тем же звучанием. Если уверены в своём произношении, нажмите «Засчитать».</p>
      ${hasPron(deck.cards)?`<label>Подсказка с произношением</label>${seg(opt,"showPron",[[true,"Показывать"],[false,"Скрыть"]])}`:""}
      <label>Количество слов</label>${seg(opt,"n",[...["10","20"].filter(v=>+v<N).map(v=>[v,v]),["all","Все ("+N+")"]])}
      ${soundSeg()}
      <div style="margin-top:20px"><button class="btn primary" id="go">Начать</button></div></div>`;
    bindSeg(opt,()=>{ LS.set("kartochki_speak_opts",opt); setup(); });
    $("#go").onclick=startAll;
  }
  function startAll(){ const N=deck.cards.length; qs=shuffle(deck.cards).slice(0,opt.n==="all"?N:+opt.n); qi=0; right=0; wrong=[]; renderQ(); }
  const norm=t=>String(t).toLowerCase().replace(/[\s.,!?;:。，！？、；：“”"'«»…\-–—]/g,"");
  function renderQ(){
    stopRec();
    if(qi>=qs.length){ const w=wrong.slice(); return renderResult(deck,{right,total:qs.length,wrong:w},{title:"Произношение",again:startAll,setup,
      redo:w.length?()=>{ qs=shuffle(w.map(x=>x.card)); qi=0; right=0; wrong=[]; renderQ(); }:null}); }
    done=false; const c=qs[qi];
    app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="muted small">${qi+1} / ${qs.length}</span></div>
      <div class="progress"><i class="b" style="width:${qi/qs.length*100}%"></i></div>
      <div class="panel question" id="qp">${spkBtn({...c,lang:c.lang==="off"?"auto":c.lang})}<div class="muted small" style="margin-bottom:8px">Произнесите</div>
        <div${termCls(c.t)}>${esc(c.t)}</div>${opt.showPron?pronHtml(c):""}<div class="muted small" style="margin-top:8px">${esc(c.d)}</div></div>
      <div class="center" style="margin-top:16px"><button class="mic" id="mic" aria-label="Говорить">${MIC_SVG}</button>
        <div class="muted small" id="st" style="margin-top:8px">Нажмите и скажите слово</div></div>
      <div id="fbw"></div>`;
    $("#mic").onclick=()=>rec?stopRec():listen(c);
  }
  function stopRec(){ if(rec){ try{ rec.abort(); }catch{} rec=null; } const m=$("#mic"); if(m) m.classList.remove("on"); }
  function listen(c){
    if(done) return;
    try{ speechSynthesis.cancel(); }catch{}
    const r=new SR(); rec=r; let got=false;
    r.lang=sayLang(c); r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
    r.onresult=e=>{ if(!live()) return; got=true; const alts=[...e.results[0]].map(a=>a.transcript); evaluate(c,alts); };
    r.onerror=e=>{ got=true; const m={"not-allowed":"Нет доступа к микрофону - разрешите его в настройках браузера","service-not-allowed":"Распознавание речи отключено в настройках устройства (на iPhone - включите Диктовку)","no-speech":"Ничего не слышно - попробуйте ещё раз, ближе к микрофону","network":"Для распознавания нужен интернет"}[e.error]||("Не удалось распознать ("+e.error+")");
      const st=$("#st"); if(st) st.textContent=m; };
    r.onend=()=>{ if(rec===r) rec=null; const mic=$("#mic"); if(mic) mic.classList.remove("on"); const st=$("#st"); if(!got&&st) st.textContent="Ничего не распознано - попробуйте ещё раз"; };
    try{ r.start(); $("#mic").classList.add("on"); $("#st").textContent="Слушаю…"; }catch(e){ rec=null; toast("Не удалось включить микрофон"); }
  }
  function evaluate(c, alts){
    const target=norm(c.t), heard=alts[0]||"";
    const ok=alts.some(a=>{ const n=norm(a); return n===target||(target.length>=1&&n.includes(target)&&n.length<=target.length+2)||(!/[㐀-鿿]/.test(c.t)&&answerMatches(a,c.t)); });
    const st=$("#st"); if(st) st.textContent="Распознано: «"+heard+"»";
    const qp=$("#qp"); if(qp){ qp.classList.remove("right","wrong"); qp.classList.add(ok?"right":"wrong"); }
    sfx(ok);
    if(ok){ done=true; right++; recordAnswer(true);
      $("#fbw").innerHTML=`<div class="fb right"><b>Верно!</b> Распознано: <span class="ans">${esc(heard)}</span></div><div class="row" style="margin-top:12px"><button class="btn primary" id="nx">Далее</button></div>`;
      $("#nx").onclick=()=>{ qi++; renderQ(); }; }
    else {
      $("#fbw").innerHTML=`<div class="fb wrong">Не совпало. Распознано: <span class="ans">${esc(heard)||"-"}</span>${alts.length>1?`<br><span class="small">варианты: ${alts.slice(1).map(esc).join(", ")}</span>`:""}</div>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="again">Ещё раз</button><button class="btn" id="ovr">Засчитать</button><button class="btn ghost" id="skip">Дальше</button></div>`;
      $("#again").onclick=()=>{ $("#fbw").innerHTML=""; $("#qp")?.classList.remove("right","wrong"); listen(c); };
      $("#ovr").onclick=()=>{ done=true; right++; recordAnswer(true); qi++; renderQ(); };
      $("#skip").onclick=()=>{ done=true; recordAnswer(false); deck.miss(c); wrong.push({card:c,ask:`<b>${esc(c.t)}</b>${pronHtml(c)}`,ans:esc(c.d),given:esc(heard)||"-"}); qi++; renderQ(); };
    }
  }
  cleanup=()=>stopRec();
  setup();
}

/* ---------- Режим «Подбор» ---------- */
let matchTimer=null;
function matchGame(deck,o){
  const live=alive();
  const seenT=new Set(), seenD=new Set(), uniq=deck.cards.filter(c=>{ if(seenT.has(c.t)||seenD.has(c.d)) return false; seenT.add(c.t); seenD.add(c.d); return true; });
  const fmt=ms=>(ms/1000).toFixed(1).replace(".",",")+" с";
  clearInterval(matchTimer);
  let sel=null, miss=0, t0=0;
  const pick=shuffle(uniq).slice(0,Math.min(6,uniq.length)); let left=pick.length;
  const tiles=shuffle([...pick.map(c=>({c,type:"t"})),...pick.map(c=>({c,type:"d"}))]);
  app.innerHTML=`<div class="study-top"><a class="small" href="${deck.back}">← ${esc(deck.title)}</a><span class="muted small"><b id="tm">0,0 с</b>${o.best?` · рекорд ${fmt(o.best)}`:""}</span></div>
    <p class="muted small" style="margin:0">Нажмите на термин, затем на его перевод. Каждая ошибка добавляет 1 секунду.</p>
    <div class="match">${tiles.map((x,k)=>`<button class="mt ${x.type==="t"&&[...x.c.t].length<=4?"term":""}" data-k="${k}">${esc(x.type==="t"?x.c.t:x.c.d)}</button>`).join("")}</div>`;
  const tick=()=>{ const el=$("#tm"); if(el) el.textContent=fmt(Date.now()-t0+miss*1000); };
  $$(".mt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, x=tiles[k];
    if(!t0){ t0=Date.now(); matchTimer=setInterval(tick,100); }
    if(x.type==="t"&&settings.autoSpeak) speak(x.c.t,sayLang(x.c));
    if(sel===null){ sel=k; b.classList.add("sel"); return; }
    if(sel===k){ sel=null; b.classList.remove("sel"); return; }
    const y=tiles[sel], bs=$(`.mt[data-k="${sel}"]`);
    if(y.c===x.c&&y.type!==x.type){ b.classList.add("done"); bs.classList.add("done"); bs.classList.remove("sel"); sel=null; recordAnswer(true); if(!o.exam) sfx(true);
      if(--left===0){ clearInterval(matchTimer); const time=Date.now()-t0+miss*1000; setTimeout(()=>{ if(live()) o.onDone({pairs:pick.length,miss,time}); },350); } }
    else if(y.type===x.type){ bs.classList.remove("sel"); sel=k; b.classList.add("sel"); }
    else { miss++; recordAnswer(false); if(!o.exam) sfx(false); deck.miss(x.type==="t"?x.c:y.c); b.classList.add("bad"); bs.classList.add("bad"); bs.classList.remove("sel"); sel=null;
      setTimeout(()=>{ b.classList.remove("bad"); bs.classList.remove("bad"); },400); }
  });
  const prev=cleanup; cleanup=()=>{ clearInterval(matchTimer); prev&&prev(); };
}
function viewMatch(deck){
  const seenT=new Set(), seenD=new Set(), uniq=deck.cards.filter(c=>{ if(seenT.has(c.t)||seenD.has(c.d)) return false; seenT.add(c.t); seenD.add(c.d); return true; });
  if(uniq.length<2){ app.innerHTML=modeHead(deck,"Подбор")+`<div class="panel">Для игры нужно хотя бы 2 разные карточки.</div>`; return; }
  const BK="kartochki_match_best", key=deck.idsStr+deck.q, fmt=ms=>(ms/1000).toFixed(1).replace(".",",")+" с";
  const run=()=>matchGame(deck,{best:LS.get(BK,{})[key],onDone:r=>{
    const all=LS.get(BK,{}), prev=all[key], rec=!prev||r.time<prev; if(rec){ all[key]=r.time; LS.set(BK,all); }
    app.innerHTML=modeHead(deck,"Подбор")+`<div class="panel center" style="padding:30px 20px"><div class="muted">Время</div><div class="score">${fmt(r.time)}</div>
      <p>${r.miss?`Ошибок: ${r.miss} (+${r.miss} с)`:"Без ошибок!"}</p>${rec?`<p><span class="badge">Новый рекорд!</span></p>`:`<p class="muted small">Рекорд: ${fmt(prev)}</p>`}
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="ag">Повторить</button><a class="btn ghost" href="${deck.back}">${deck.back==="#/"?"На главную":"К набору"}</a></div></div>`;
    $("#ag").onclick=run; }});
  run();
}

/* ---------- Статистика ---------- */
async function viewStats(){
  if(!user) return needAuth();
  loading(); flushStats();
  const [mine,st]=await Promise.all([mySetsC(),store.studying()]);
  const ids=new Set(mine.map(s=>s.id));
  const others=(await Promise.all(st.filter(x=>!ids.has(x.id)).map(x=>getSetC(x.id)))).filter(Boolean);
  const pm=Object.fromEntries(st.map(x=>[x.id,x])), t=today();
  let total=0, known=0, long=0, due=0, inSrs=0; const hard=[];
  for(const s of [...mine,...others]){ const p=pm[s.id]||{}, kn=new Set(p.known||[]), srs=p.srs||{}, miss=p.miss||{};
    for(const c of s.cards){ total++; if(kn.has(c.id)) known++; const r=srs[c.id]; if(r){ inSrs++; if(r.int>=21) long++; if(r.due<=t) due++; }
      if(miss[c.id]) hard.push({c,s,n:miss[c.id]}); } }
  hard.sort((a,b)=>b.n-a.n);
  const days=[...Array(14)].map((_,k)=>t-13+k), vals=days.map(d=>stats.days[dayStr(d)]?.n||0), mx=Math.max(1,...vals);
  const week=days.slice(7).reduce((a,d)=>a+(stats.days[dayStr(d)]?.n||0),0), tdv=stats.days[dayStr(t)]||{n:0,ok:0};
  const wk=["вс","пн","вт","ср","чт","пт","сб"];
  app.innerHTML=`<p class="small"><a href="#/">← Все наборы</a></p><h1>Статистика</h1>
    <div class="tiles">
      <div class="panel tile"><b>${plural(streak(),"день","дня","дней")}</b><span class="muted small">серия занятий подряд</span></div>
      <div class="panel tile"><b>${tdv.n}</b><span class="muted small">ответов сегодня${tdv.n?`, верно ${Math.round(tdv.ok/tdv.n*100)}%`:""}</span></div>
      <div class="panel tile"><b>${week}</b><span class="muted small">ответов за 7 дней</span></div>
      <div class="panel tile"><b>${due}</b><span class="muted small">к повторению сейчас</span></div>
      <div class="panel tile"><b>${known} / ${total}</b><span class="muted small">карточек «знаю»</span></div>
      <div class="panel tile"><b>${long}</b><span class="muted small">в долгой памяти (интервал от 3 недель)</span></div>
    </div>
    <h2>Активность за 2 недели</h2>
    <div class="panel"><div class="bars">${vals.map((v,k)=>`<div class="${v?"":"z"}" style="height:${v?Math.max(4,v/mx*100):2}%" title="${fmtDay(days[k])}: ${v}"></div>`).join("")}</div>
      <div class="bars-l">${days.map(d=>`<span>${wk[new Date(d*864e5).getUTCDay()]}</span>`).join("")}</div></div>
    <h2>Самые трудные карточки</h2>
    ${hard.length?`<div class="panel" style="padding:4px 8px"><table>${hard.slice(0,15).map(h=>`<tr><td>${esc(h.c.t)}${pronHtml(h.c)}</td><td>${esc(h.c.d)}<br><span class="muted small">${esc(h.s.title)} · ошибок: ${h.n}</span></td></tr>`).join("")}</table></div>`
      :`<div class="panel muted">Пока нет ошибок - или вы ещё не занимались.</div>`}
    <p class="muted small">Учтены ${plural(inSrs,"карточка","карточки","карточек")} в интервальном повторении. Статистика ответов собирается с этого обновления.</p>`;
}

window.addEventListener("hashchange",route);
window.addEventListener("pagehide",()=>{ try{ flushStats(); }catch{} });
(async()=>{

    try{ const s=await store.getStats(); stats={days:{...(s.days||{}),...stats.days}}; }catch{}
    route(); });
})();
